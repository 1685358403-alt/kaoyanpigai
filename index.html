<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4c6ef5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>考研英语二 · 翻译作文 AI 批改与专项训练</title>
<!-- ===== assets/css/style.css ===== -->
<style>
/* ============ 基础变量 ============ */
:root{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --panel-2:#f8fafc;
  --line:#e6eaf2;
  --line-2:#eef1f7;
  --text:#1b2434;
  --text-2:#5b667a;
  --text-3:#8b95a8;
  --primary:#4c6ef5;
  --primary-d:#3b5bdb;
  --primary-l:#eef2ff;
  --green:#12a06a;
  --green-l:#e7f7f0;
  --blue:#2f7fe0;
  --blue-l:#eaf3fd;
  --orange:#e8833a;
  --orange-l:#fdf1e6;
  --red:#e0453c;
  --red-l:#fdeceb;
  --purple:#8250df;
  --purple-l:#f3edfd;
  --radius:14px;
  --radius-s:10px;
  --shadow:0 1px 2px rgba(23,35,58,.05), 0 8px 24px rgba(23,35,58,.06);
  --shadow-s:0 1px 3px rgba(23,35,58,.08);
  --sidebar-w:236px;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.35}
p{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
textarea,input,select{font-family:inherit;font-size:15px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d3dae6;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局骨架 ============ */
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.brand-logo{
  width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4c6ef5,#7048e8);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:0 0 38px;
}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text strong{font-size:15px}
.brand-text span{font-size:11.5px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px;flex:1;overflow:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:var(--text-2);font-size:14.5px;text-align:left;width:100%;transition:.15s;
}
.nav-item .ico{width:20px;text-align:center;font-size:16px}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--primary-l);color:var(--primary-d);font-weight:600}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600}
.sidebar-foot{padding:14px}
.streak-card{background:linear-gradient(135deg,#fff4e6,#ffe9d6);border-radius:var(--radius);padding:12px 14px;text-align:center}
.streak-num{font-size:26px;font-weight:800;color:#e8833a;line-height:1.1}
.streak-label{font-size:11.5px;color:#a86a3c}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 26px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar-title h1{font-size:19px;font-weight:700}
.topbar-title p{font-size:12.5px;color:var(--text-3);margin-top:1px}
.model-chip{
  font-size:12px;padding:5px 11px;border-radius:20px;background:var(--panel-2);
  color:var(--text-2);border:1px solid var(--line);white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;
}
.model-chip.ok{background:var(--green-l);color:var(--green);border-color:#c9ecdd}
.model-chip.warn{background:var(--orange-l);color:var(--orange);border-color:#f7ddc4}
.view-wrap{padding:22px 26px 60px;max-width:1080px;width:100%}

.tabbar{display:none}

/* ============ 通用组件 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s)}
.card-pad{padding:18px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center}
.row-wrap{flex-wrap:wrap}
.spacer{flex:1}
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:12px}
.sec-title .dot{width:4px;height:15px;border-radius:3px;background:var(--primary)}
.hint{font-size:12.5px;color:var(--text-3);line-height:1.6}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;
  background:var(--panel-2);color:var(--text-2);border:1px solid var(--line);transition:.15s;
}
.btn:hover{background:#eef1f7}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(76,110,245,.28)}
.btn-primary:hover{background:var(--primary-d)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{filter:brightness(.94)}
.btn-outline{background:#fff}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:15px}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}

.field{margin-bottom:14px}
.label{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.label .req{color:var(--red)}
.input,.textarea,.select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;
  outline:none;transition:.15s;line-height:1.6;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(76,110,245,.12)}
.textarea{resize:vertical;min-height:110px}
.textarea.tall{min-height:200px}
.textarea.en{font-family:"SF Mono","Cascadia Mono",Consolas,Monaco,monospace;font-size:14.5px}

.tabs{display:flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:11px;overflow-x:auto}
.tabs button{
  flex:1;white-space:nowrap;padding:7px 13px;border-radius:8px;font-size:13.5px;
  color:var(--text-2);font-weight:600;transition:.15s;
}
.tabs button.active{background:#fff;color:var(--primary-d);box-shadow:var(--shadow-s)}

.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:20px;
  background:var(--panel-2);color:var(--text-2);border:1px solid var(--line);
}
.tag-blue{background:var(--blue-l);color:var(--blue);border-color:#d6e7fa}
.tag-green{background:var(--green-l);color:var(--green);border-color:#c9ecdd}
.tag-orange{background:var(--orange-l);color:var(--orange);border-color:#f7ddc4}
.tag-red{background:var(--red-l);color:var(--red);border-color:#f8d3d1}
.tag-purple{background:var(--purple-l);color:var(--purple);border-color:#e3d5fb}

/* ============ 提示卡片 ============ */
.callout{background:var(--primary-l);border:1px solid #d6e7fa;border-radius:10px;padding:12px 14px}
.callout .co-title{font-size:13.5px;font-weight:700;color:var(--primary-d)}

/* ============ 模型选择器 ============ */
.md-list{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.md-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:.12s}
.md-item:hover{background:var(--bg-2);border-color:var(--line)}
.mi-main{flex:1;min-width:0}
.mi-id{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--text);word-break:break-all;line-height:1.4}
.mi-name{font-size:12px;color:var(--text-3);margin-top:2px;word-break:break-all}
.mi-tags{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.md-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.md-seg button{border:none;border-radius:0;background:var(--panel);padding:6px 12px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit}
.md-seg button.on{background:var(--primary);color:#fff}

.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty .emo{font-size:34px;display:block;margin-bottom:10px}
.empty p{font-size:13.5px}

/* ============ 上传区 ============ */
.uploader{
  border:1.5px dashed #c9d3e6;border-radius:12px;padding:14px;text-align:center;
  background:var(--panel-2);transition:.15s;cursor:pointer;
}
.uploader:hover,.uploader.drag{border-color:var(--primary);background:var(--primary-l)}
.uploader .u-ico{font-size:20px}
.uploader .u-txt{font-size:13px;color:var(--text-2);margin-top:2px}
.uploader .u-sub{font-size:11.5px;color:var(--text-3)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:80px;height:80px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .del{
  position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.55);
  color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;
}
.mode-switch{display:flex;gap:6px;margin-bottom:10px}
.mode-switch button{
  flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;
}
.mode-switch button.active{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d)}

/* ============ 批改结果 ============ */
.score-hero{
  display:flex;align-items:center;gap:20px;padding:20px;border-radius:var(--radius);
  background:linear-gradient(135deg,#f7f9ff,#eef3ff);border:1px solid #dde6fb;
}
.score-big{text-align:center;flex:0 0 118px}
.score-big .num{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.score-big .num .den{font-size:17px;font-weight:600;color:var(--text-3);letter-spacing:0}
.score-big .band{margin-top:6px}
.score-meta{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.meta-box{background:rgba(255,255,255,.75);border-radius:10px;padding:8px 11px;border:1px solid #e6ecfa}
.meta-box .k{font-size:11.5px;color:var(--text-3)}
.meta-box .v{font-size:14px;font-weight:600;margin-top:1px;word-break:break-word}
.score-b1 .num{color:var(--green)}
.score-b2 .num{color:var(--blue)}
.score-b3 .num{color:var(--orange)}
.score-b4 .num{color:var(--red)}

.bar{height:8px;border-radius:6px;background:#e8edf5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--primary)}
.bar.g i{background:var(--green)}.bar.b i{background:var(--blue)}
.bar.o i{background:var(--orange)}.bar.r i{background:var(--red)}

.sent-item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.sent-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel-2);border-bottom:1px solid var(--line-2)}
.sent-idx{
  width:23px;height:23px;border-radius:7px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:0 0 23px;
}
.sent-src{font-size:13px;color:var(--text-2);flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sent-score{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap}
.sent-body{padding:13px 14px}
.sent-line{margin-bottom:10px}
.sent-line .k{
  font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.4px;margin-bottom:3px;
  display:flex;align-items:center;gap:5px;
}
.sent-line .v{font-size:14px;line-height:1.7;background:var(--panel-2);padding:8px 11px;border-radius:9px;border:1px solid var(--line-2)}
.sent-line .v.en{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:13.8px}
.sent-line .v.good{background:var(--green-l);border-color:#c9ecdd}
.sent-line .v.bad{background:var(--red-l);border-color:#f8d3d1}
.kp-list{display:flex;flex-direction:column;gap:6px}
.kp{display:flex;align-items:flex-start;gap:8px;font-size:13px;background:var(--panel-2);padding:7px 10px;border-radius:9px;border:1px solid var(--line-2)}
.kp .kp-i{
  flex:0 0 auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;margin-top:1px;
}
.kp.hit .kp-i{background:var(--green-l);color:var(--green)}
.kp.partial .kp-i{background:var(--orange-l);color:var(--orange)}
.kp.miss .kp-i{background:var(--red-l);color:var(--red)}
.kp .kp-t{flex:1;min-width:0}
.kp .kp-n{font-size:12px;color:var(--text-3);margin-top:2px}

.essay-line{border-bottom:1px dashed var(--line);padding:12px 0}
.essay-line:last-child{border-bottom:none}
.essay-line .orig,.essay-line .fix{
  padding:8px 11px;border-radius:9px;font-size:14px;line-height:1.75;
  font-family:"SF Mono","Cascadia Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-word;
}
.essay-line .orig{background:var(--red-l);border:1px solid #f8d3d1}
.essay-line .fix{background:var(--green-l);border:1px solid #c9ecdd}
.essay-line .fix b{background:#ffe9a8;border-radius:3px;padding:0 2px}
.essay-line .cn{font-size:13px;color:var(--text-2);margin-top:6px;background:var(--panel-2);padding:7px 10px;border-radius:8px;border:1px solid var(--line-2)}
.essay-line .fl{font-size:11.5px;font-weight:700;color:var(--text-3);margin-bottom:3px;display:block}
.essay-line .fl .opt{color:var(--orange)}
.essay-line .fl .must{color:var(--red)}

.exp-item{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;margin-bottom:9px}
.exp-item .e{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:14px;font-weight:600;color:var(--primary-d)}
.exp-item .m{font-size:12.5px;color:var(--text-2);margin-top:3px}

.weak-item{display:flex;gap:10px;padding:12px;border-radius:11px;background:#fff;border:1px solid var(--line);margin-bottom:9px}
.weak-item .wi-n{
  flex:0 0 22px;height:22px;border-radius:7px;background:var(--orange-l);color:var(--orange);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.weak-item .wi-t{font-size:14px;font-weight:600}
.weak-item .wi-d{font-size:13px;color:var(--text-2);margin-top:2px}

/* ============ 训练 ============ */
.train-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;transition:.18s}
.train-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.train-card .tc-top{padding:14px 15px 12px;display:flex;gap:11px}
.train-card .tc-ico{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 38px;
}
.train-card .tc-t{font-size:15px;font-weight:700}
.train-card .tc-d{font-size:12.5px;color:var(--text-3);margin-top:2px;line-height:1.55}
.train-card .tc-foot{padding:10px 15px;border-top:1px solid var(--line-2);background:var(--panel-2);display:flex;align-items:center;justify-content:space-between}

.q-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.q-n{width:21px;height:21px;border-radius:6px;background:var(--text);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 21px}
.q-en{font-family:"SF Mono","Cascadia Mono",Consolas,monospace;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.q-cn{font-size:14px;line-height:1.75;white-space:pre-wrap;background:var(--panel-2);padding:9px 11px;border-radius:9px;border:1px solid var(--line-2)}

.chart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.chart-title{font-size:14.5px;font-weight:700;margin-bottom:8px}
table.data-tb{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.data-tb th,table.data-tb td{border:1px solid var(--line);padding:6px 9px;text-align:center}
table.data-tb th{background:var(--panel-2);font-weight:600}
table.data-tb td:first-child{text-align:left}
table.data-tb tbody tr:hover td{background:#fafcff}

.pick-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pick{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;text-align:left;transition:.15s;width:100%}
.pick:hover{border-color:var(--primary);background:var(--primary-l)}
.pick.active{border-color:var(--primary);background:var(--primary-l);box-shadow:0 0 0 3px rgba(76,110,245,.1)}
.pick .pt{font-size:14px;font-weight:600}
.pick .pd{font-size:12px;color:var(--text-3);margin-top:2px}

.stat-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.stat-box .s-k{font-size:12px;color:var(--text-3)}
.stat-box .s-v{font-size:25px;font-weight:800;line-height:1.2}
.stat-box .s-sub{font-size:11.5px;color:var(--text-3)}

.list-item{display:flex;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:9px;align-items:center}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-d{font-size:12.5px;color:var(--text-3);margin-top:2px}
.score-pill{font-size:14px;font-weight:800;padding:3px 11px;border-radius:20px;flex:0 0 auto}
.p1{background:var(--green-l);color:var(--green)}
.p2{background:var(--blue-l);color:var(--blue)}
.p3{background:var(--orange-l);color:var(--orange)}
.p4{background:var(--red-l);color:var(--red)}

/* ============ 弹层 / Toast ============ */
.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;display:none}
.mask.show{display:block}
.sheet{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.97);
  width:min(720px,92vw);max-height:84vh;background:#fff;border-radius:16px;z-index:61;
  display:none;flex-direction:column;box-shadow:0 24px 60px rgba(15,23,42,.28);opacity:0;transition:.18s;
}
.sheet.show{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:16px}
.sheet-body{padding:18px;overflow:auto}

.loading{position:fixed;inset:0;background:rgba(244,246,251,.86);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center}
.loading.show{display:flex}
.loading-box{text-align:center}
.spinner{
  width:44px;height:44px;margin:0 auto 14px;border-radius:50%;
  border:3px solid #d9e1f2;border-top-color:var(--primary);animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:15px;font-weight:600}
.loading-sub{font-size:12.5px;color:var(--text-3);margin-top:3px}

.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + var(--safe-b));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#1f2937;color:#fff;padding:9px 18px;border-radius:22px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  animation:tin .25s ease;max-width:88vw;
}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ============ 移动端 ============ */
@media (max-width:900px){
  .sidebar{display:none}
  .view-wrap{padding:14px 14px 92px;max-width:100%}
  .topbar{padding:12px 14px}
  .topbar-title h1{font-size:17px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.keep2,.g3.keep2,.g2.keep2{grid-template-columns:1fr 1fr}
  .grid{gap:11px}
  .card-pad{padding:14px}
  .score-hero{flex-direction:column;align-items:stretch;gap:14px;padding:16px}
  .score-big{flex:none;display:flex;align-items:center;justify-content:center;gap:14px}
  .score-big .num{font-size:38px}
  .score-big .band{margin:0}
  .score-meta{grid-template-columns:1fr 1fr}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + var(--safe-b));
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;
    font-size:10.5px;color:var(--text-3);
  }
  .tabbar button .ico{font-size:19px;line-height:1}
  .tabbar button.active{color:var(--primary);font-weight:700}
  .sheet{width:94vw;max-height:88vh}
  .tabs button{flex:0 0 auto}
}
@media print{
  .sidebar,.topbar,.tabbar,.btn{display:none!important}
  .view-wrap{padding:0}
  .card{border:none;box-shadow:none}
}

<script>
/* ============================================================
 *  bank.js —— 内置题库

window.APP = window.APP || {};

APP.bank = (function () {

  /* ---------------- 翻译段落库（英译汉） ---------------- */
  const passages = [
    {
      id: 't01', title: '习惯是如何养成的', topic: '社会心理', level: '基础',
      text: `Most of us assume that we form a habit through repetition, and that the more often we repeat an action, the more automatic it becomes. Recent research, however, suggests that the context in which we act matters just as much. A study conducted among office workers found that those who performed a new behavior at the same time and in the same place every day established the habit nearly twice as fast as those who did not. What this means for anyone hoping to change their life is simple enough: rather than relying on willpower, we should design an environment that makes the desired action easier to perform and the unwanted one harder to repeat.`,
      reference: `我们大多数人认为，习惯是通过重复养成的，而且一个行为重复得越频繁，它就变得越自动。然而，近期研究表明，我们行为所处的情境同样重要。一项针对上班族开展的研究发现，那些每天在同一时间、同一地点执行某种新行为的人，养成该习惯的速度几乎是不这样做的人的两倍。对于任何希望改变自己生活的人来说，这意味着一个简单的道理：与其依赖意志力，我们不如设计一种环境，让想要的行为更容易做到，让不想要的行为更难重复。`
    },
    {
      id: 't02', title: '超市为何这样设计', topic: '商业经济', level: '基础',
      text: `The modern supermarket is designed to keep customers inside for as long as possible, and almost every detail of its layout serves this purpose. Essentials such as milk and bread are placed at the back of the store, so that shoppers must walk past hundreds of other products to reach them. Background music is slowed down, because studies have shown that people move more slowly and spend about ten percent more when the tempo is relaxed. Even the size of the trolley matters: the larger it is, the more emptiness shoppers feel an urge to fill.`,
      reference: `现代超市的设计目的是让顾客在店内停留尽可能长的时间，其布局的几乎每一个细节都在为这一目标服务。牛奶、面包等必需品被摆放在商店最里面，这样一来，购物者必须经过数百种其他商品才能取到它们。背景音乐的节奏被放慢，因为研究表明，当节奏舒缓时，人们走得更慢，消费额大约会高出百分之十。甚至连购物车的尺寸都有影响：购物车越大，购物者就越会产生一种想要把它填满的冲动。`
    },
    {
      id: 't03', title: '阅读给孩子带来什么', topic: '教育文化', level: '提高',
      text: `Parents are often told that reading to young children is the single most valuable thing they can do for their education. What is less often explained is why this should be so. It is not merely that children learn new words; rather, they gradually acquire a sense of how stories are structured, which later enables them to follow arguments that unfold over many pages. Children who are read to frequently also tend to develop what psychologists call theory of mind, the ability to imagine what another person believes and feels. That capacity, it turns out, is a far better predictor of later academic success than the number of words a child knows at the age of five.`,
      reference: `父母常常被告知，给年幼的孩子读书是他们能为孩子教育所做的最有价值的一件事。较少有人解释的是，为什么情况会是这样。这不仅仅是因为孩子们学到了新词；更确切地说，他们逐渐获得了一种关于故事如何组织的感觉，这日后使他们能够跟上跨越数页才逐步展开的论证。经常被读书给孩子听的孩子，还往往发展出心理学家所称的"心理理论"，即想象他人所想与所感的能力。事实证明，与一个孩子五岁时所掌握词汇的数量相比，这种能力是预测其日后学业成功好得多的指标。`
    },
    {
      id: 't04', title: '人工智能会取代工作吗', topic: '科技', level: '提高',
      text: `Whenever a technology capable of performing human tasks appears, the same fear resurfaces: machines will take our jobs. History suggests that the reality is more complicated. Although automation has indeed destroyed many roles, it has also created new ones that nobody could have foreseen, and it has raised productivity to a degree that allows societies to afford goods and services previously available only to the rich. The genuine risk, economists argue, is not that there will be too little work, but that the transition will be too fast for workers whose skills are tied to a single industry. What policymakers must decide is how to share the gains while supporting those left behind.`,
      reference: `每当一种能够执行人类任务的技术出现，同样的恐惧就会再次浮现：机器将夺走我们的工作。历史表明，现实要复杂得多。尽管自动化确实摧毁了许多岗位，它也创造了无人能够预见的新岗位，并且把生产率提高到这样一种程度，使得社会能够负担得起此前只有富人才能享用的商品与服务。经济学家认为，真正的风险不在于工作会太少，而在于对于那些技能只与单一行业绑定的劳动者来说，转型会太快。政策制定者必须决定的是，如何在分享收益的同时，帮助那些被落在后面的人。`
    },
    {
      id: 't05', title: '城市需要更多绿地', topic: '环境', level: '基础',

      reference: `城市规划者长期以来把公园视为一种奢侈品，是住房与交通等更为紧迫的事务解决之后才添加的东西。过去二十年收集的证据却指向相反的结论。能否接触绿地与更低的心脏病发病率、更好的心理健康以及更紧密的邻里关系相关联，而这一切都会减轻公共服务的负担。此外，树木能使周围空气降温若干度，随着热浪愈发频繁，这一效应也愈发有价值。从这个意义上说，公园不是装饰，而是一项基础设施。`
    },
    {
      id: 't06', title: '我们为什么睡不好', topic: '健康生活', level: '基础',
      text: `Sleep researchers distinguish between two systems that together determine when we feel alert. The first is a clock in the brain that follows a roughly twenty-four-hour cycle; the second is a pressure that builds the longer we remain awake and is released only by sleeping. Problems arise when these systems fall out of step, as they do for shift workers and for anyone who spends the evening staring at a bright screen. What makes the situation worse is that tiredness is a poor guide to how tired we really are: after several short nights, people report feeling normal while performing as badly as someone who has not slept at all.`,
      reference: `睡眠研究者区分出两套系统，它们共同决定我们何时感到清醒。第一套是大脑中遵循大致二十四小时周期的时钟；第二套是一种压力，我们醒着的时间越长它就累积得越多，只有睡眠才能将其释放。当这两套系统失去同步时，问题就出现了，倒班工人以及任何整晚盯着明亮屏幕的人都是如此。让情况更糟的是，疲倦感并不是衡量我们真实疲倦程度的可靠指标：连续几个睡眠不足的夜晚之后，人们会说自己感觉正常，而实际表现却和完全没睡的人一样糟糕。`
    },
    {
      id: 't07', title: '远程办公的得与失', topic: '职场', level: '提高',
      text: `The shift towards remote work was sudden, but its consequences are likely to be lasting. Employees value the flexibility it offers, and many report that they would accept a lower salary rather than return to a daily commute. Employers, however, worry about what is lost when people are no longer in the same room: the informal conversations in which ideas are tested, the ease with which a senior colleague corrects a beginner's mistake, and the sense of belonging to something larger than oneself. It is unlikely that either side will win the argument outright. More probable is a compromise in which offices become places people go to collaborate rather than places they go to be seen.`,
      reference: `向远程办公的转变来得很突然，但其影响很可能是持久的。员工看重它所提供的灵活性，许多人表示，他们宁愿接受更低的薪水，也不愿重回每天通勤的生活。然而，雇主担心的是，当人们不再身处同一个房间时，会失去什么：那些用来检验想法的非正式交谈，资深同事纠正新手错误时的便利，以及归属于某种大于自身的事物的感觉。双方不太可能有一方彻底赢得争论。更可能出现的折中方案是：办公室将成为人们前往协作的场所，而不是人们前往被看见的场所。`

    {
      id: 't08', title: '博物馆为何免费开放', topic: '文化', level: '基础',
      text: `When a country decides to make its national museums free of charge, the argument is usually about fairness: collections belong to the public and should not be reserved for those who can afford a ticket. The evidence, though, is mixed. Admission fees are indeed a barrier for low-income visitors, but removing them does not by itself produce a more diverse audience, since the cost of travel and the habit of visiting are often stronger obstacles. Museums that have succeeded in widening their reach have done so not merely by opening their doors but by going out into schools and community centres, where interest can be cultivated long before anyone thinks of buying a ticket.`,
      reference: `当一个国家决定让本国国立博物馆免费开放时，其理由通常关乎公平：藏品属于公众，不应只为买得起票的人保留。然而，相关证据却并不一致。门票费用对低收入参观者而言确实构成障碍，但取消门票本身并不会带来更多元化的观众群体，因为交通成本与参观习惯往往是更大的阻碍。那些成功扩大了受众面的博物馆，靠的不仅仅是敞开大门，而是走进学校与社区中心——在那里，兴趣早在任何人想到买票之前就能被培养起来。`

    {
      id: 't09', title: '社交媒体让我们更孤独吗', topic: '社会心理', level: '提高',
      text: `It is often claimed that social media has made us more connected than ever and more lonely than ever, and both halves of this claim are difficult to dispute. What surveys cannot easily settle is whether one causes the other. People who feel isolated may turn to their screens precisely because they lack company offline, in which case the technology is a symptom rather than a cause. There is, however, one finding that recurs across studies: passive use, the endless scrolling through other people's lives, is associated with lower well-being, whereas active use, such as sending a message to a friend, is not.`,
      reference: `人们常说，社交媒体让我们比以往任何时候都联系得更紧密，也比以往任何时候都更孤独，而这一说法的两个部分都很难反驳。调查难以厘清的是，其中一方是否导致了另一方。感到孤独的人之所以转向屏幕，可能恰恰因为他们在线下缺少陪伴，在这种情况下，技术是症状而非原因。不过，有一项发现反复出现在各项研究中：被动使用——无休止地刷别人的生活——与更低的幸福感相关，而主动使用，例如给朋友发一条消息，则不然。`

      reference: `随着人口老龄化，各国政府面临着一个历史没有提供清晰先例的问题：如何组织一个老年人多于年轻人的社会。通常的回答是从成本的角度来表述的，养老金与医疗被描述为不断缩减的劳动力必须背负的负担。人口学家警告说，这种思维方式忽视了老年人所作出的贡献，从无偿照看孩子，到维持地方机构运转的志愿服务。它还假定老年的含义是固定不变的，而事实上，如今一个普通的七十岁老人，比上一代人中普通的六十岁老人更健康、受教育程度更高。`

      reference: `运动能改善情绪，是医生与公众普遍认同的少数健康论断之一。不太清楚的是，多少才算足够。在一些试验中，久坐的成年人被要求每天步行三十分钟、每周五天，结果显示，其改善程度与药物对轻度抑郁症患者所产生的效果相当。重要的是，收益并没有随着剂量的增加而持续上升：运动量远超推荐量的参与者，并不比遵循推荐量的人表现得更好。对于任何因为要求太高而放弃健身计划的人来说，这应该是令人鼓舞的消息。`

      id: 't12', title: '为什么小企业难以长大', topic: '商业经济', level: '提高',

      reference: `小企业常被描述为创造就业的引擎，然而它们中的大多数从未发展到超出寥寥数名雇员的规模。对此的解释很少是需求不足。更常见的原因是，创始人要么缺乏意愿，要么缺乏能力去管理一个组织——而一旦达到一定规模，组织的复杂性就会急剧上升。雇用三名助手的面包师可以亲自监督一切；雇用三十名员工的面包师则必须授权，而授权所需的技能与烘焙几乎没有共同之处。及早认识到这一差距，正是不断扩张的企业与仅仅勉强生存的企业之间的区别所在。`
    }
  ];

  /* ---------------- 图表作文题库 ---------------- */
  const charts = [

  const essayUser = (promptText, essay, note) => `【作文题目/图表说明】
${promptText}

【考生作文】
${essay}

${note ? '【考生特别说明】\n' + note + '\n\n' : ''}请按评分参考批改，输出 JSON。`;

  /* ========== 三、图片转录 ========== */
  const transcribeSystem = `你是一名精确的誊写员。请把图片中的文字逐行、逐字转录出来。
要求：
1. 英文部分保持英文原文（含标点），中文部分保持中文。
2. 严格保留原有换行与段落结构，按原文的行顺序输出。
3. 绝对不要翻译、改写、润色或补全内容。
4. 无法辨认的字，用【?】代替，一个字符一个【?】，不要猜测。
5. 只输出转录结果文本，不要任何说明、标题或 markdown 标记。`;

  /* ========== 四、专项训练：出题 ========== */
  const trainGenSystem = `你是考研英语二辅导专家，负责为考生生成"针对性专项训练题"。请根据考生指定的训练类型、薄弱点和难度，生成高质量、可直接作答的训练题。

要求：
1. 题目必须紧扣所要求的训练类型与薄弱点。
2. 翻译类题目：英文句子/段落难度对标考研英语二（约 150 词段落，或 3-5 个单句），题材为社会心理、商业经济、教育文化、科技环境、生活健康等常考主题。
3. 作文类题目：图表描述信息完整（对象、时间、单位、数值、比例、排序、趋势），任务指令清晰。
4. 每题必须同时给出"参考答案/评分要点"，便于后续自动批改。

仅输出 JSON，不要 markdown 代码块标记。JSON 结构：
{
  "title": "训练标题",
  "intro": "训练说明（1-2 句，告诉考生怎么作答）",
  "items": [
    {
      "id": 1,
      "stem": "题干（英文句子 / 中文提示 / 图表描述 / 任务指令，按类型而定）",
      "hint": "提示（可选，如已给关键词、结构提示；没有则空字符串）",
      "reference": "参考答案",
      "points": ["评分要点1", "评分要点2", "评分要点3"]
    }
  ]
}
items 数量按类型确定：单句精译 3-5 题，其他类型 2-4 题。`;

  const trainGenUser = (type, typeDesc, weaknesses, level, count) =>
`训练类型：${type}
类型说明：${typeDesc}
考生薄弱点：${weaknesses && weaknesses.length ? weaknesses.join('、') : '暂无记录，按通用情况处理'}
难度：${level}
题目数量：${count}
请生成训练题，输出 JSON。`;

  /* ========== 五、专项训练：批改 ========== */
  const trainGradeSystem = `你是考研英语二辅导老师，正在批改一份专项训练答卷。请结合每题的"评分要点"与"参考答案"，逐题批改。

批改要求：
1. 逐题给出 0-100 的得分，并说明得分理由。
2. 明确指出必须修改的问题，以及可选的优化建议。
3. 针对翻译类：检查关键结构（定语从句、状语、被动、比较、插入语等）是否译对，是否有漏译、错译、中文搭配不当。
4. 针对图表描述类：检查对象、时间、单位、数值、比例、排序、趋势是否准确；区分静态对比与动态变化；不混淆百分比与百分点；不编造数据。
5. 针对英文写作类：检查数据/趋势表达、语法、搭配、衔接。
6. 最后给出本次训练的总体评价与 2-3 条下一步训练建议，并给出需要加入错题本的具体条目。

仅输出 JSON，不要 markdown 代码块标记。JSON 结构：
{
  "avgScore": 82,
  "items": [
    {
      "id": 1,
      "stem": "题干（原样）",
      "student": "考生作答（原样）",
      "score": 85,
      "reference": "参考答案",
      "problems": [{"text": "问题所在（引用考生原内容）", "fix": "应改为", "reason": "原因说明", "level": "must|optional"}],
      "comment": "本题点评"
    }
  ],
  "summary": "总体评价（中文，120-200 字）",
  "suggestions": ["下一步训练建议1", "下一步训练建议2"],
  "wrongItems": [
    {"tag": "薄弱点标签（从给定标签库中选择最接近的，或自拟）", "title": "错题标题", "content": "应记住的正确内容/规律", "source": "来源题目简述"}
  ],
  "newWeaknesses": ["薄弱点标签1", "薄弱点标签2"]
}`;

  const trainGradeUser = (trainTitle, items, answers) =>
`【训练名称】${trainTitle}

【题目与参考答案】
${items.map(it => `#${it.id}\n题干：${it.stem}\n参考答案：${it.reference}\n评分要点：${(it.points || []).join('；')}`).join('\n\n')}

【考生作答】
${answers.map(a => `#${a.id}\n${a.answer || '（未作答）'}`).join('\n\n')}

请逐题批改，输出 JSON。`;

  /* ========== 六、通用对话式辅导（薄弱点讲解） ========== */
  const coachSystem = `你是考研英语二（翻译 + 大作文）的资深辅导老师，面向一位正在冲刺的考生。
回答要求：
1. 简洁、实用，直击问题，不讲空话套话。
2. 涉及翻译技巧时，给出「原句 → 错误译法 → 正确译法 → 规律总结」四步。
3. 涉及作文时，给出「问题 → 修改 → 可复用表达 → 框架」四步。
4. 用中文讲解，英文部分以英文呈现。
5. 适当使用列表与加粗，便于阅读，但不要使用 markdown 标题层级过多。`;

  return {
    translatorSystem, translatorUser,
    essaySystem, essayUser,
    transcribeSystem,
    trainGenSystem, trainGenUser,
    trainGradeSystem, trainGradeUser,
    coachSystem
  };
})();

<script>
/* ============================================================
 *  store.js —— 本地数据层（localStorage）
 * ============================================================ */
window.APP = window.APP || {};

APP.store = (function () {
  const KEY = 'ky2_grader_v1';

  const DEFAULT = {
    settings: {
      provider: 'deepseek',
      baseUrl: 'https://api.deepseek.com/v1',
      apiKey: '',
      model: 'deepseek-chat',
      visionModel: '',          // 空 = 用主模型；图片转录需要支持 vision 的模型
      visionBaseUrl: '',
      temperature: 0.3,
      strictMode: true,          // 严格按评分标准，不抬分
      autoSave: true
    },
    records: [],                 // 批改记录
    wrongBook: [],               // 错题本
    weaknesses: {},              // { tag: {count, lastAt, score} }
    training: {},                // 训练进度
    checkins: [],                // 打卡日期 'YYYY-MM-DD'
    lastRoute: 'dashboard'
  };

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign({}, DEFAULT, JSON.parse(raw)) : JSON.parse(JSON.stringify(DEFAULT));
      state.settings = Object.assign({}, DEFAULT.settings, state.settings || {});
    } catch (e) {
      state = JSON.parse(JSON.stringify(DEFAULT));
    }
    return state;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn('保存失败', e); }
  }

  function get() { return state || load(); }

  function update(fn) { fn(get()); save(); }

  /* ---------------- 设置 ---------------- */
  const getSettings = () => get().settings;
  function setSettings(patch) {
    update(s => { Object.assign(s.settings, patch); });
  }

  /* ---------------- 打卡 ---------------- */
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function checkin() {
    const t = today();
    update(s => { if (!s.checkins.includes(t)) s.checkins.push(t); });
  }
  function streak() {
    const set = new Set(get().checkins);
    let n = 0;
    const d = new Date();
    // 今天没打卡不算断，从今天往前找
    for (;;) {
      const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (set.has(k)) { n++; d.setDate(d.getDate() - 1); }
      else if (n === 0 && k === today()) { d.setDate(d.getDate() - 1); }
      else break;
      if (n > 3650) break;
    }
    return n;
  }

  /* ---------------- 批改记录 ---------------- */
  function addRecord(rec) {
    const r = Object.assign({
      id: 'r' + Date.now() + Math.random().toString(36).slice(2, 6),
      createdAt: Date.now(),
      type: 'translation',        // translation | essay | training
      title: '',
      score: 0,
      full: 15,
      band: '',
      data: null
    }, rec);
    update(s => {
      s.records.unshift(r);
      if (s.records.length > 300) s.records.length = 300;
    });
    checkin();
    return r;
  }
  function getRecords(type) {
    const rs = get().records;
    return type ? rs.filter(r => r.type === type) : rs;
  }
  function getRecord(id) { return get().records.find(r => r.id === id); }
  function delRecord(id) {
    update(s => { s.records = s.records.filter(r => r.id !== id); });
  }
  function clearRecords(type) {
    update(s => { s.records = type ? s.records.filter(r => r.type !== type) : []; });
  }

  /* ---------------- 薄弱环节 ---------------- */
  function addWeaknesses(tags, score) {
    if (!tags || !tags.length) return;
    update(s => {
      tags.forEach(t => {
        const tag = (t || '').trim();
        if (!tag) return;
        const w = s.weaknesses[tag] || { count: 0, lastAt: 0, scores: [] };
        w.count++;
        w.lastAt = Date.now();
        if (typeof score === 'number') w.scores.push(score);
        s.weaknesses[tag] = w;
      });
    });
  }
  function getWeaknesses() {
    const w = get().weaknesses;
    return Object.keys(w).map(k => Object.assign({ tag: k }, w[k]))
      .sort((a, b) => (b.count - a.count) || (b.lastAt - a.lastAt));
  }
  function topWeaknesses(n) {
    return getWeaknesses().slice(0, n || 6);
  }
  function clearWeaknesses() { update(s => { s.weaknesses = {}; }); }

  /* ---------------- 错题本 ---------------- */
  function addWrong(items) {
    if (!items || !items.length) return;
    update(s => {
      items.forEach(it => {
        if (!it || !it.title) return;
        s.wrongBook.unshift(Object.assign({
          id: 'w' + Date.now() + Math.random().toString(36).slice(2, 6),
          createdAt: Date.now(), tag: '未分类', title: '', content: '', source: '', mastered: false
        }, it));
      });
      if (s.wrongBook.length > 500) s.wrongBook.length = 500;
    });
  }
  const getWrong = () => get().wrongBook;
  function toggleMastered(id) {
    update(s => {
      const it = s.wrongBook.find(x => x.id === id);
      if (it) it.mastered = !it.mastered;
    });
  }
  function delWrong(id) { update(s => { s.wrongBook = s.wrongBook.filter(x => x.id !== id); }); }

  /* ---------------- 导入导出 ---------------- */
  function exportJSON() { return JSON.stringify(get(), null, 2); }
  function importJSON(text) {
    try {
      const obj = JSON.parse(text);
      if (!obj || typeof obj !== 'object') throw new Error('格式错误');
      const merged = Object.assign({}, DEFAULT, obj);
      merged.settings = Object.assign({}, DEFAULT.settings, obj.settings || {});
      state = merged; save(); return true;
    } catch (e) { return false; }
  }
  function reset() { state = JSON.parse(JSON.stringify(DEFAULT)); save(); }

  load();
  return {
    get, save, update, getSettings, setSettings,
    checkin, streak, today,
    addRecord, getRecords, getRecord, delRecord, clearRecords,
    addWeaknesses, getWeaknesses, topWeaknesses, clearWeaknesses,
    addWrong, getWrong, toggleMastered, delWrong,
    exportJSON, importJSON, reset
  };
})();

</script>

<script>
/* ============================================================
 *  ui.js —— 通用界面工具
 * ============================================================ */
window.APP = window.APP || {};

APP.ui = (function () {

  /* ---------- 转义 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  /** 允许 <b> 标签的转义（用于 AI 返回的加粗修改处） */
  function escB(s) {
    return esc(s).replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>')
      .replace(/&lt;strong&gt;/g, '<b>').replace(/&lt;\/strong&gt;/g, '</b>');
  }
  /** 极简 markdown：加粗、换行、列表 */
  function md(s) {
    if (!s) return '';
    let t = esc(s);
    t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    t = t.replace(/`(.+?)`/g, '<code>$1</code>');
    t = t.split(/\n/).map(line => {
      const li = line.match(/^\s*[-•]\s+(.*)$/);
      if (li) return '<div class="kp"><span style="color:var(--text-3)">•</span><span>' + li[1] + '</span></div>';
      return line;
    }).join('<br>');
    return t;
  }

  /* ---------- Toast ---------- */
  function toast(msg, type) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => {
      el.style.transition = '.25s'; el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
      setTimeout(() => el.remove(), 260);
    }, 2200);
  }

  /* ---------- Loading ---------- */
  const LOADING_TIPS = [
    ['阅卷老师正在批改…', '逐句比对采分点'],
    ['正在核对原文与译文…', '检查漏译与错译'],
    ['正在统计错别字…', '按整篇累计扣分'],
    ['正在生成参考佳译…', '对照评分档位定分']
  ];
  let tipTimer = null;
  function loading(show, text, sub) {
    const el = document.getElementById('loading');
    if (show) {
      document.getElementById('loadingText').textContent = text || LOADING_TIPS[0][0];
      document.getElementById('loadingSub').textContent = sub || LOADING_TIPS[0][1];
      el.classList.add('show');
      let i = 0;
      clearInterval(tipTimer);
      if (!text) {
        tipTimer = setInterval(() => {
          i = (i + 1) % LOADING_TIPS.length;
          document.getElementById('loadingText').textContent = LOADING_TIPS[i][0];
          document.getElementById('loadingSub').textContent = LOADING_TIPS[i][1];
        }, 2600);
      }
    } else {
      el.classList.remove('show'); clearInterval(tipTimer);
    }
  }

  /* ---------- Sheet 弹层 ---------- */
  function sheet(title, html, onMount) {
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetBody').innerHTML = html;
    document.getElementById('mask').classList.add('show');
    document.getElementById('sheet').classList.add('show');
    if (onMount) onMount(document.getElementById('sheetBody'));
  }
  function closeSheet() {
    document.getElementById('mask').classList.remove('show');
    document.getElementById('sheet').classList.remove('show');
  }
  document.addEventListener('click', e => {
    if (e.target.id === 'mask' || e.target.id === 'sheetClose') closeSheet();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  /* ---------- 图片处理 ---------- */
  function fileToCompressed(file, maxSide) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => {
        if (!/^image\//.test(file.type)) { resolve(fr.result); return; }
        const img = new Image();
        img.onload = () => {
          const m = maxSide || 1400;
          let { width: w, height: h } = img;
          const scale = Math.min(1, m / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => resolve(fr.result);
        img.src = fr.result;
      };
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
  }

  /** 上传控件：返回 { files: [dataURL], el } */
  function uploader(opts) {
    const id = 'up' + Math.random().toString(36).slice(2, 8);
    const files = [];
    const el = document.createElement('div');
    el.innerHTML =
      '<div class="uploader" id="' + id + '_zone">' +
        '<div class="u-ico">🖼️</div>' +
        '<div class="u-txt">点击上传图片，或把图片拖到这里</div>' +
        '<div class="u-sub">支持手写译文/作文照片、题目截图，可多选</div>' +
        '<input type="file" accept="image/*" multiple style="display:none" id="' + id + '_input">' +
      '</div>' +
      '<div class="thumbs" id="' + id + '_thumbs"></div>';
    const zone = el.querySelector('#' + id + '_zone');
    const input = el.querySelector('#' + id + '_input');
    const thumbs = el.querySelector('#' + id + '_thumbs');

    function render() {
      thumbs.innerHTML = files.map((f, i) =>
        '<div class="thumb"><img src="' + f + '"><div class="del" data-i="' + i + '">✕</div></div>'
      ).join('');
      thumbs.querySelectorAll('.del').forEach(b => {
        b.onclick = ev => { ev.stopPropagation(); files.splice(+b.dataset.i, 1); render(); };
      });
      if (opts && opts.onChange) opts.onChange(files.slice());
    }
    async function add(list) {
      for (const f of list) {
        if (files.length >= 6) { toast('最多上传 6 张图片'); break; }
        try { files.push(await fileToCompressed(f)); } catch (e) { }
      }
      render();
    }
    zone.onclick = () => input.click();
    input.onchange = e => { add(Array.from(e.target.files)); input.value = ''; };
    ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag'); }));
    zone.addEventListener('drop', e => { add(Array.from(e.dataTransfer.files || [])); });

    return { el, files };
  }

  /* ---------- 档位样式 ---------- */
  function bandClass(score) {
    if (score >= 13) return 'score-b1';
    if (score >= 9) return 'score-b2';
    if (score >= 5) return 'score-b3';
    return 'score-b4';
  }
  function pillClass(score) {
    if (score >= 13) return 'p1';
    if (score >= 9) return 'p2';
    if (score >= 5) return 'p3';
    return 'p4';
  }
  function barClass(score, full) {
    const r = full ? score / full : score / 100;
    if (r >= .85) return 'g'; if (r >= .6) return 'b'; if (r >= .4) return 'o'; return 'r';
  }

  /* ---------- 时间 ---------- */
  function timeAgo(ts) {
    const d = Math.floor((Date.now() - ts) / 1000);
    if (d < 60) return '刚刚';
    if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
    if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
    if (d < 2592000) return Math.floor(d / 86400) + ' 天前';
    const dt = new Date(ts);
    return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
  }

  /* ---------- 复制到剪贴板 ---------- */
  function copy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { }
    ta.remove();
    if (navigator.clipboard && !ok) {
      navigator.clipboard.writeText(text).then(() => { }).catch(() => { });
    }
    toast(ok ? '已复制到剪贴板' : '复制失败，请手动选择复制', ok ? 'ok' : 'err');
    return ok;
  }

  function empty(emo, text) {
    return '<div class="empty"><span class="emo">' + emo + '</span><p>' + esc(text) + '</p></div>';
  }

  return { esc, escB, md, toast, loading, sheet, closeSheet, uploader, fileToCompressed, bandClass, pillClass, barClass, timeAgo, copy, empty };
})();

</script>

  const PROVIDERS = {
    deepseek:  { name: 'DeepSeek',    baseUrl: 'https://api.deepseek.com/v1',                model: 'deepseek-chat' },
    moonshot:  { name: 'Moonshot',    baseUrl: 'https://api.moonshot.cn/v1',                 model: 'moonshot-v1-8k' },
    zhipu:     { name: '智谱 GLM',     baseUrl: 'https://open.bigmodel.cn/api/paas/v4',       model: 'glm-4-flash' },
    dashscope: { name: '阿里云通义',   baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
    silicon:   { name: '硅基流动',     baseUrl: 'https://api.siliconflow.cn/v1',              model: 'Qwen/Qwen2.5-7B-Instruct' },
    openai:    { name: 'OpenAI',      baseUrl: 'https://api.openai.com/v1',                  model: 'gpt-4o-mini' },
    // ↓ 一个 Key 多种模型的聚合/中转类
    openrouter:{ name: '聚合站 · OpenRouter', baseUrl: 'https://openrouter.ai/api/v1',        model: '', agg: true },
    ark:       { name: '聚合站 · 火山方舟',   baseUrl: 'https://ark.cn-beijing.volces.com/api/v3', model: '', agg: true },
    agg302:    { name: '聚合站 · 302.AI',    baseUrl: 'https://api.302.ai/v1',                model: '', agg: true },
    oneapi:    { name: '聚合站 · 自建（one-api / new-api / VoAPI 等）', baseUrl: '',          model: '', agg: true },
    custom:    { name: '自定义',       baseUrl: '',                                           model: '' }
  };

  function settings() { return APP.store.getSettings(); }
  function ready() {
    const s = settings();
    return !!(s.apiKey && s.baseUrl && s.model);
  }
  function normalizeUrl(u) {
    u = String(u || '').trim().replace(/\/+$/, '');
    if (!u) return '';
    if (!/\/chat\/completions$/.test(u)) u += '/chat/completions';
    return u;
  }

  /* ---------------- 核心请求 ---------------- */
  async function chat(messages, opts) {
    opts = opts || {};
    const s = settings();
    const useVision = !!opts.vision;
    let baseUrl = useVision && s.visionBaseUrl ? s.visionBaseUrl : s.baseUrl;
    let model = useVision && s.visionModel ? s.visionModel : s.model;
    if (!s.apiKey) throw new Error('NO_KEY');
    if (!baseUrl || !model) throw new Error('NO_CFG');

    const url = normalizeUrl(baseUrl);
    const body = {
      model, messages,
      temperature: typeof s.temperature === 'number' ? s.temperature : 0.3,
      stream: false
    };
    if (opts.json) body.response_format = { type: 'json_object' };

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey },
        body: JSON.stringify(body)
      });
    } catch (e) {
      throw new Error('NETWORK');
    }
    if (!res.ok) {
      let msg = '';
      try { const j = await res.json(); msg = (j.error && (j.error.message || j.error.code)) || j.message || ''; } catch (e) { msg = await res.text().catch(() => ''); }
      const e = new Error('API_' + res.status);
      e.detail = msg;
      throw e;
    }
    const j = await res.json();
    const content = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!content) throw new Error('EMPTY');
    return content;
  }

  function errMsg(e) {
    if (e.message === 'NO_KEY') return '还没配置 API Key，请先到「设置」里填写，或改用「复制批改请求」模式。';
    if (e.message === 'NO_CFG') return '接口地址或模型名不完整，请到「设置」检查。';
    if (e.message === 'NETWORK') return '网络请求失败：可能是接口地址错误、跨域（CORS）被拦截或网络不通。建议改用「复制批改请求」模式，或换用支持浏览器直连的接口。';
    if (e.message === 'EMPTY') return '模型返回为空，请稍后重试或降低输入长度。';
    if (e.message === 'BADFMT') return '接口返回的内容不是标准的模型列表格式。可以直接在下方手填模型 ID。';
    if (/^HTTP_/.test(e.message)) {
      const code = e.message.slice(5);
      if (code === '404') return '该地址下没有 /models 接口（404）。请确认接口地址是否形如 https://xxx/v1，或直接在下方手填模型 ID。';
      if (code === '405') return '该地址不支持 GET 请求（405），可直接手填模型 ID。';
      return '获取模型列表失败（' + code + '），可以在下方手填模型 ID。';
    }
    if (e.message === 'PARSE') return '模型返回的不是合法 JSON。可在设置里关闭「JSON 强制模式」后重试，或换用指令跟随更强的模型。';
    if (/^API_/.test(e.message)) {
      const code = e.message.slice(4);
      const map = {
        401: 'API Key 无效或已过期（401）。',
        403: '没有该模型的访问权限（403）。',
        429: '请求过于频繁或余额不足（429）。',
        404: '接口地址或模型名不存在（404）。',
        500: '服务端错误（500），请稍后重试。',
        503: '服务暂时不可用（503），请稍后重试。'
      };
      return (map[code] || ('请求失败（' + code + '）')) + (e.detail ? ' 详情：' + e.detail : '');
    }
    return e.message || '未知错误';
  }

  /* ---------------- JSON 解析容错 ---------------- */
  function parseJSON(text) {
    if (!text) throw new Error('PARSE');
    let t = String(text).trim();
    t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    t = t.trim();
    try { return JSON.parse(t); } catch (e) { }
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) {
      try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { }
      // 尝试修复尾部多余逗号
      try { return JSON.parse(t.slice(a, b + 1).replace(/,\s*([}\]])/g, '$1')); } catch (e) { }
    }
    throw new Error('PARSE');
  }

  async function chatJSON(messages, opts) {
    const raw = await chat(messages, Object.assign({ json: true }, opts || {}));
    return parseJSON(raw);
  }

  /* ============================================================
   *  跨域（CORS）探测 —— 决定「能不能联网批改」
   *  浏览器发带 Authorization 的 POST 前，一定会先发 OPTIONS 预检；
   *  预检响应里没有 Access-Control-Allow-Origin，请求就会被浏览器直接掐掉。
   *  所以这里探测的正是那一次预检。
   * ============================================================ */
  /** 纯函数：拿到 ACAO 响应头后判断是否放行（抽出来便于单独验证） */
  function corsVerdict(acao, origin) {
    const a = String(acao || '').trim();
    if (!a) return false;
    if (a === '*') return true;                 // 允许任意来源
    return !!origin && a === String(origin);    // 或精确回显本站来源
  }

  async function probeCors(baseUrl) {
    if (typeof location !== 'undefined' && location.protocol === 'file:') {
      return { ok: false, reason: 'file' };
    }
    const url = normalizeUrl(baseUrl);
    if (!url) return { ok: false, reason: 'nocfg' };
    try {
      const res = await fetch(url, {
        method: 'OPTIONS',
        headers: {
          'Access-Control-Request-Method': 'POST',
          'Access-Control-Request-Headers': 'content-type,authorization'
        }
      });
      const acao = (res.headers.get('access-control-allow-origin') || '').trim();
      const origin = (typeof location !== 'undefined' && location.origin) || '';
      const ok = corsVerdict(acao, origin);
      return { ok, acao, origin, status: res.status, reason: ok ? '' : 'noheader' };
    } catch (e) {
      // fetch 在跨域失败时抛 TypeError，正是「不许直连」的信号
      return { ok: false, reason: 'blocked' };
    }
  }

  /* ============================================================
   *  模型列表 —— 专为「一个 Key 多模型」的聚合站设计
   *  调用 OpenAI 兼容的 GET {base}/models，自动派生候选地址
   * ============================================================ */

  /** 由 chat 地址派生 /models 候选地址（按命中概率排序） */
  function modelsCandidates(u) {
    const base = String(u || '').trim().replace(/\/+$/, '').replace(/\/chat\/completions$/, '');
    if (!base) return [];
    const out = [];
    const push = x => { if (x && out.indexOf(x) < 0) out.push(x); };
    const m = base.match(/^(.*?)\/v(\d+)$/);
    if (m) {                       // 用户填了 .../v1 或 .../api/v3
      push(base + '/models');
      push(base + '/v1/models');
    } else {                       // 用户只填了域名
      push(base + '/v1/models');
      push(base + '/models');
    }
    push(base.replace(/\/v\d+$/, '') + '/models');
    return out.filter(x => /\/models$/.test(x) && !/\/v\d+\/v\d+\/models$/.test(x));
  }

  /** 依据模型名猜测是否支持图片输入（仅作提示，非保证） */
  const VISION_MISS = /(deepseek|moonshot|kimi|glm-4-(flash|air|plus|9b)|glm-4\.|qwen-(plus|turbo|max)|qwen2\.5-(7|14|32|72)b-instruct|qwen3-(?!.*vl)|yi-|baichuan|ernie|hunyuan(?!.*vision)|gpt-3\.5|o1-mini|r1|reasoner|embedding|rerank|whisper|tts|bge-|dall-e|dall·e|moderation|grok-beta)/i;
  const VISION_HIT = /(vision|-vl|vl-|4v|qwen.*vl|qvq|internvl|llava|minicpm-v|gemini|gpt-4o|gpt-4\.1|gpt-4-1|o1|o3|o4|claude-3|claude-(opus|sonnet|haiku)-[45]|grok-4|grok-2.*vision|pixtral|phi-3-vision|phi-4-multimodal|step-1v|yi-vl)/i;
  function guessVision(label) {
    const s = String(label || '');
    if (VISION_MISS.test(s)) return false;
    return VISION_HIT.test(s);
  }

  /** 从不同站点的返回体里抽出统一结构 [{id,name,ctx,vision}] */
  function extractModels(j) {
    let arr = null;
    if (Array.isArray(j)) arr = j;
    else if (j && Array.isArray(j.data)) arr = j.data;
    else if (j && j.data && Array.isArray(j.data.models)) arr = j.data.models;
    else if (j && j.data && Array.isArray(j.data.data)) arr = j.data.data;
    else if (j && Array.isArray(j.models)) arr = j.models;
    else if (j && Array.isArray(j.results)) arr = j.results;
    if (!arr) throw new Error('BADFMT');

    const out = [], seen = {};
    arr.forEach(it => {
      let id = '', name = '', ctx = 0, vision = false, known = false;
      if (typeof it === 'string') {
        id = it.trim();
      } else if (it && typeof it === 'object') {
        id = String(it.id || it.model || it.model_name || it.modelName || it.name || '').trim();
        if (!id) return;
        name = String(it.display_name || it.displayName || it.owned_by || '').trim();
        ctx = it.context_length || it.context_tokens || it.max_context_length || it.context || 0;
        const mods = (it.architecture && it.architecture.input_modalities) ||
          it.input_modalities || (it.capabilities && it.capabilities.input) || it.modalities;
        if (Array.isArray(mods)) { known = true; vision = mods.some(m => /image|vision/i.test(String(m))); }
      }
      if (!id || seen[id]) return;
      seen[id] = 1;
      if (!known) vision = guessVision(id + ' ' + name);
      out.push({ id, name, ctx: Number(ctx) || 0, vision });
    });
    out.sort((a, b) => a.id.localeCompare(b.id));
    return out;
  }

  async function fetchModelsOnce(url, key) {
    let res;
    try {
      res = await fetch(url, {
        method: 'GET',
        headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }
      });
    } catch (e) { throw new Error('NETWORK'); }
    if (res.status === 401 || res.status === 403) {
      let d = '';
      try { const j = await res.json(); d = (j.error && (j.error.message || j.error.code)) || j.message || ''; } catch (e) { }
      const e = new Error('API_' + res.status); e.detail = d; throw e;
    }
    if (!res.ok) { const e = new Error('HTTP_' + res.status); throw e; }
    const j = await res.json().catch(() => null);
    if (!j) throw new Error('BADFMT');
    return extractModels(j);
  }

  /** 获取可用模型列表（会依次尝试候选地址） */
  async function listModels(opts) {
    opts = opts || {};
    const s = settings();
    const key = (opts.apiKey != null ? opts.apiKey : s.apiKey) || '';
    const base = (opts.baseUrl != null ? opts.baseUrl : s.baseUrl) || '';
    if (!key) throw new Error('NO_KEY');
    if (!base) throw new Error('NO_CFG');
    const urls = modelsCandidates(base);
    let last = null;
    for (const u of urls) {
      try { return { url: u, models: await fetchModelsOnce(u, key) }; }
      catch (e) {
        // 鉴权类错误说明地址是对的，没必要再试其他候选
        if (e.message === 'API_401' || e.message === 'API_403') throw e;
        last = e;
      }
    }
    throw last || new Error('NETWORK');
  }

  /** 兜底：用户手动粘贴 /models 返回内容，或一行一个模型 ID */
  function parseModelList(text) {
    const t = String(text || '').trim();
    if (!t) throw new Error('EMPTY');
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) {
      for (const cand of [t, t.slice(a, b + 1)]) {
        try { return extractModels(JSON.parse(cand)); } catch (e) { }
      }
    }
    const ids = t.split(/[\n,;，；]/).map(x => x.trim())
      .filter(x => x && !/\s/.test(x) && x.length < 120 && !/^[{}\[\]]/.test(x));
    const seen = {}, out = [];
    ids.forEach(id => {
      if (!seen[id]) { seen[id] = 1; out.push({ id, name: '', ctx: 0, vision: guessVision(id) }); }
    });
    if (!out.length) throw new Error('BADFMT');
    out.sort((x, y) => x.id.localeCompare(y.id));
    return out;
  }

  /* ---------------- 图片转录 ---------------- */
  async function transcribe(images, hint) {
    const s = settings();
    const vm = s.visionModel || s.model;
    const content = [{ type: 'text', text: APP.prompts.transcribeSystem + (hint ? '\n【背景提示】' + hint : '') }];
    images.forEach(src => {
      content.push({ type: 'image_url', image_url: { url: src } });
    });
    const msgs = [{ role: 'user', content }];
    try {
      return await chat(msgs, { vision: true });
    } catch (e) {
      if (/不支持|invalid|image|vision|400/i.test(e.detail || '') || /^API_400/.test(e.message)) {
        throw new Error('VISION_UNSUPPORTED');
      }
      throw e;
    }
  }

  /* ---------------- 带图批改（失败自动降级为纯文本） ---------------- */
  async function gradeWithImages(system, text, images) {
    if (images && images.length) {
      try {
        return await chatJSON([
          { role: 'system', content: system },
          {
            role: 'user',
            content: [{ type: 'text', text: text }].concat(
              images.map(src => ({ type: 'image_url', image_url: { url: src } }))
            )
          }
        ], { vision: true });
      } catch (e) {
        // 视觉模型不可用或不支持图片时，退回纯文本批改，不打断用户
        console.warn('带图批改失败，已降级为纯文本：', e.message);
      }
    }
    return await chatJSON([
      { role: 'system', content: system },
      { role: 'user', content: text }
    ]);
  }

  /* ---------------- 翻译批改 ---------------- */
  async function gradeTranslation(original, student, note, images) {
    return await gradeWithImages(
      APP.prompts.translatorSystem,
      APP.prompts.translatorUser(original, student, note),
      images
    );
  }

  /* ---------------- 作文批改 ---------------- */
  async function gradeEssay(promptText, essay, note, images) {
    return await gradeWithImages(
      APP.prompts.essaySystem,
      APP.prompts.essayUser(promptText, essay, note),
      images
    );
  }

  /* ---------------- 训练出题 / 批改 ---------------- */
  async function genTraining(type, typeDesc, weaknesses, level, count) {
    return await chatJSON([
      { role: 'system', content: APP.prompts.trainGenSystem },
      { role: 'user', content: APP.prompts.trainGenUser(type, typeDesc, weaknesses, level, count) }
    ]);
  }
  async function gradeTraining(title, items, answers) {
    return await chatJSON([
      { role: 'system', content: APP.prompts.trainGradeSystem },
      { role: 'user', content: APP.prompts.trainGradeUser(title, items, answers) }
    ]);
  }

  /* ---------------- 教练问答 ---------------- */
  async function coach(question, context) {
    return await chat([
      { role: 'system', content: APP.prompts.coachSystem },
      { role: 'user', content: (context ? '【背景】\n' + context + '\n\n' : '') + '【我的问题】\n' + question }
    ], { json: false });
  }

  /* ---------------- 兜底：生成可复制的批改请求 ---------------- */
  function buildRequest(kind, payload) {
    if (kind === 'translation') {
      return '【角色与规则】\n' + APP.prompts.translatorSystem +
        '\n\n【我的作答】\n' + APP.prompts.translatorUser(payload.original, payload.student, payload.note) +
        '\n\n（请把批改结果按 JSON 结构返回给我；若你无法返回 JSON，按同样的四部分内容用文字输出也可以。）';
    }
    if (kind === 'essay') {
      return '【角色与规则】\n' + APP.prompts.essaySystem +
        '\n\n【我的作答】\n' + APP.prompts.essayUser(payload.promptText, payload.essay, payload.note) +
        '\n\n（请把批改结果按 JSON 结构返回给我；若你无法返回 JSON，按同样的四部分内容用文字输出也可以。）';
    }
    return '';
  }

  return {
    PROVIDERS, settings, ready, chat, chatJSON, parseJSON, errMsg,
    listModels, parseModelList, modelsCandidates, guessVision, probeCors, corsVerdict,
    transcribe, gradeTranslation, gradeEssay, genTraining, gradeTraining, coach, buildRequest
  };
})();

</script>
