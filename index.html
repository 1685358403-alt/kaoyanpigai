              <span class="score-pill ${APP.ui.pillClass(r.score)}">${r.score}<span style="font-size:11px;opacity:.7">/${r.full}</span></span>
              <button class="icon-btn" onclick="APP.views.dashboard.viewRecord('${r.id}')">›</button>
            </div>`).join('') || APP.ui.empty('🗂️', '还没有批改记录，去「翻译批改」或「作文批改」提交第一份作业吧。')}
        </div>
      </div>

      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>快速开始</div>
        <div class="grid g3">
          ${this.quick('📝', '翻译批改', '逐句采分、错别字统计、错译漏译定位', 'translate')}
          ${this.quick('📊', '作文批改', '四维评分、逐句精批、修改后全文、复盘积累', 'essay')}
          ${this.quick('🎯', '专项训练', '翻译五练 + 作文六练，哪里弱就练哪里', 'train')}
        </div>
      </div>

      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>评分标准速览</div>
        <div class="grid g2">
          <div>
            <div style="font-size:13.5px;font-weight:700;margin-bottom:6px">翻译（15 分）</div>
            <div class="hint">
              第 1 档 13-15 分：理解准确无误，表达通顺清楚，无错译漏译。<br>
              第 2 档 9-12 分：理解基本准确，表达比较通顺，无重大错译漏译。<br>
              第 3 档 5-8 分：理解不够准确，表达欠通顺，有明显漏译错译。<br>
              第 4 档 0-4 分：不能理解原文，表达不通顺，文字支离破碎。<br>
              <b>硬性规则：</b>单句明显扭曲原意 ≤0.5 分；一题多译，其中之一有错按错译评分；错别字满 3 个扣 0.5 分，不足 3 个扣 0.25 分；每句分 3-4 个采分点按点给分。
            </div>
          </div>
          <div>
            <div style="font-size:13.5px;font-weight:700;margin-bottom:6px">大作文（15 分）</div>
            <div class="hint">
              13-15 分：要点完整，图表描述准确，评论充分，语言丰富自然。<br>
              10-12 分：主要要点完整，偶有错误，整体连贯。<br>
              7-9 分：涵盖多数要点，存在错误但不影响理解。<br>
              4-6 分：遗漏重要内容或有理解偏差，错误较多。<br>
              1-3 分：严重偏离任务，难以有效表达；0 分：未作答或完全无关。<br>
              <b>注意：</b>静态对比 ≠ 时间趋势；百分比 ≠ 百分点；不编造数据；合理推测不能写成图表已证明的事实。
            </div>
          </div>
        </div>
      </div>`;
  },

  stat(k, v, u, c) {
    return `<div class="stat-box"><div class="s-k">${k}</div><div class="s-v" style="color:${c}">${v}<span style="font-size:13px;font-weight:600;color:var(--text-3)">${u}</span></div></div>`;
  },
  quick(ico, t, d, route) {
    return `<div class="train-card" onclick="APP.go('${route}')" style="cursor:pointer">
      <div class="tc-top">
        <div class="tc-ico" style="background:var(--primary-l)">${ico}</div>
        <div><div class="tc-t">${t}</div><div class="tc-d">${d}</div></div>
      </div>
    </div>`;
  },

  advice(weak, trans, essays, trains) {
    if (!trans.length && !essays.length && !trains.length) {
      return '还没有任何练习记录。建议先做一次完整的翻译批改（用内置题库里的段落），让系统建立你的薄弱点画像，之后再按薄弱点安排专项训练。';
    }
    const tags = weak.map(w => w.tag).join('、');
    const parts = [];
    if (weak.length) parts.push('你最近反复出现的问题是：' + tags + '。');
    if (trans.length >= 2) {
      const last2 = trans.slice(0, 2).map(r => r.score);
      const diff = last2[0] - last2[1];
      if (diff > 0.5) parts.push('翻译有进步，继续保持，接下来重点攻克长难句拆分与词义选择。');
      else if (diff < -0.5) parts.push('翻译分数有所回落，建议回到最近的批改记录，把每一条扣分原因逐条整理进错题本。');
    } else if (!trans.length) parts.push('翻译部分还没有数据，建议今天先完成一篇。');
    if (!essays.length) parts.push('作文部分还没有数据，建议先做「图表信息描述」基础训练，再动笔写整篇。');
    parts.push('今天的训练量建议：翻译 1 篇 + 专项训练 2 组。');
    return parts.join('');
  },

  viewRecord(id) {
    const r = APP.store.getRecord(id);
    if (!r) return;
    if (r.type === 'translation') APP.views.translate.showResult(r.data, r.title);
    else if (r.type === 'essay') APP.views.essay.showResult(r.data, r.title);
    else APP.views.train.showResult(r.data, r.title);
  }
};

</script>
<!-- ===== assets/js/views/translate.js ===== -->
<script>
/* ============================================================
 *  views/translate.js —— 翻译批改（15 分）
 * ============================================================ */
window.APP = window.APP || {}; APP.views = APP.views || {};

APP.views.translate = {
  title: '翻译批改', sub: '英译汉 · 逐句采分 · 15 分制', icon: '📝',

  state: { pid: '', mode: 'text', imgs: [], qimgs: [], qimgOpen: false, last: null },

  render(root) {
    const p = APP.bank.passages;
    const cur = p.find(x => x.id === this.state.pid) || p[0];
    this.state.pid = cur.id;

    root.innerHTML = `
      <div class="card card-pad">
        <div class="sec-title"><span class="dot"></span>第一步 · 确定英文原文</div>
        <div class="row row-wrap">
          <select class="select" id="trPid" style="max-width:340px">
            ${p.map(x => `<option value="${x.id}"${x.id === cur.id ? ' selected' : ''}>${APP.ui.esc(x.title)} · ${APP.ui.esc(x.topic)} · ${APP.ui.esc(x.level)}</option>`).join('')}
          </select>
          <button class="btn btn-sm" onclick="APP.views.translate.fillPassage()">载入题库段落</button>
          <button class="btn btn-sm btn-outline" onclick="APP.views.translate.toggleQImg()">🖼️ 从图片导入题目</button>
          <button class="btn btn-sm" onclick="APP.views.translate.clearOriginal()">清空自定义</button>
          <div class="spacer"></div>
          <span class="tag tag-blue">建议 20 分钟内完成</span>
        </div>
        <div id="trQImgBox" class="mt12"></div>
        <div class="field mt12">
          <div class="label">英文原文 <span class="hint">（可自行粘贴替换，或由上方图片识别填入）</span></div>
          <textarea class="textarea en tall" id="trOriginal" placeholder="在此粘贴英文原文…">${APP.ui.esc(cur.text)}</textarea>
        </div>
      </div>

      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>第二步 · 提交你的译文</div>
        <div class="mode-switch">
          <button id="mText" class="active" onclick="APP.views.translate.setMode('text')">⌨️ 直接输入文字</button>
          <button id="mImg" onclick="APP.views.translate.setMode('img')">🖼️ 上传手写图片</button>
        </div>
        <div id="trInputBox"></div>
        <div class="field mt12">
          <div class="label">补充说明 <span class="hint">（可选，例如"第 3 句我不确定，也想看看直译版本"）</span></div>
          <input class="input" id="trNote" placeholder="告诉阅卷老师你想重点关注什么">
        </div>
        <div class="row row-wrap mt8">
          <button class="btn btn-primary" onclick="APP.views.translate.submit()">📮 提交批改</button>
          <button class="btn" onclick="APP.views.translate.copyRequest()">📋 复制批改请求（无 API Key 时用）</button>
          <button class="btn" onclick="APP.views.translate.pasteResult()">📥 粘贴批改结果</button>
          <button class="btn" onclick="APP.views.translate.showRef()">👀 查看题库参考译文</button>
        </div>
        <div class="hint mt8">
          提示一：一题多译时，只要其中一个译法有错，就按错误译法评分——所以拿不准的地方不要"两个都写上"。<br>
          提示二：若第一步上传了题目图片，原图会随批改请求一并发给阅卷老师（需视觉模型），转录有误差时也能对准原文。
        </div>
      </div>

      <div id="trResult"></div>`;

    document.getElementById('trPid').onchange = e => { this.state.pid = e.target.value; this.fillPassage(); };
    if (this.state.qimgOpen) this.toggleQImg(true);
    this.setMode(this.state.mode);
  },

  /* ---------- 题目图片导入 ---------- */
  toggleQImg(keep) {
    const box = document.getElementById('trQImgBox');
    if (!box) return;
    if (!keep) this.state.qimgOpen = !this.state.qimgOpen;
    if (!this.state.qimgOpen) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <div class="uploader-slot" id="trQUp"></div>
      <div class="row row-wrap mt8">
        <button class="btn btn-sm btn-green" id="trQTrans">🔍 识别图片中的英文原文</button>
        <button class="btn btn-sm" id="trQAppend">➕ 追加到原文末尾</button>
        <button class="btn btn-sm" id="trQClear">🗑️ 移除题目图片</button>
        <span class="hint">适合纸质试卷、真题书拍照；识别后请核对，无法辨认处会标为【?】</span>
      </div>`;
    const up = APP.ui.uploader({ onChange: f => { this.state.qimgs = f; } });
    box.querySelector('#trQUp').appendChild(up.el);
    // 重新展开时回填此前已选的题目图片
    if (this.state.qimgs.length) {
      const thumbs = up.el.querySelector('.thumbs');
      thumbs.innerHTML = this.state.qimgs.map((f, i) =>
        `<div class="thumb"><img src="${f}"><div class="del" data-i="${i}">✕</div></div>`).join('');
      thumbs.querySelectorAll('.del').forEach(b => {
        b.onclick = ev => { ev.stopPropagation(); this.state.qimgs.splice(+b.dataset.i, 1); this.toggleQImg(true); };
      });
    }
    box.querySelector('#trQTrans').onclick = () => this.transcribeQ(false);
    box.querySelector('#trQAppend').onclick = () => this.transcribeQ(true);
    box.querySelector('#trQClear').onclick = () => { this.state.qimgs = []; this.toggleQImg(true); };
  },

  async transcribeQ(append) {
    if (!this.state.qimgs.length) { APP.ui.toast('请先上传题目图片', 'err'); return; }
    if (!APP.ai.ready()) {
      APP.ui.toast('请先在「设置」配置 API Key', 'err');
      APP.go('settings'); return;
    }
    APP.ui.loading(true, '正在识别题目图片…', '逐行转录英文原文');
    try {
      const text = await APP.ai.transcribe(this.state.qimgs,
        '这是考研英语（二）翻译题的题目部分，请把英文原文（题目要求与待翻译的英文段落）完整转录出来，只保留英文原文，不要翻译。');
      const ta = document.getElementById('trOriginal');
      const t = String(text).trim();
      ta.value = (append && ta.value.trim()) ? ta.value.replace(/\s*$/, '') + '\n\n' + t : t;
      APP.ui.toast('识别完成，请核对原文', 'ok');
      ta.focus();
    } catch (e) {
      APP.ui.toast(e.message === 'VISION_UNSUPPORTED'
        ? '当前模型不支持图片识别，请在「设置 → 视觉模型」里填写支持图片理解的模型'
        : APP.ai.errMsg(e), 'err');
    } finally { APP.ui.loading(false); }
  },

  setMode(m) {
    this.state.mode = m;
    const box = document.getElementById('trInputBox');
    if (!box) return;
    ['mText', 'mImg'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('active', id === ('m' + m[0].toUpperCase() + m.slice(1)));
    });
    box.innerHTML = '';
    if (m === 'text') {
      const ta = document.createElement('textarea');
      ta.className = 'textarea tall';
      ta.id = 'trStudent';
      ta.placeholder = '在此输入你的中文译文…（逐句对应原文，方便逐句采分）';
      box.appendChild(ta);
    } else {
      const wrap = document.createElement('div');
      box.appendChild(wrap);
      const up = APP.ui.uploader({ onChange: f => { this.state.imgs = f; } });
      wrap.appendChild(up.el);
      const ta = document.createElement('textarea');
      ta.className = 'textarea tall mt12';
      ta.id = 'trStudent';
      ta.placeholder = '图片转录结果会出现在这里，请务必核对后再提交批改。无法辨认处 AI 会用【?】标出，请手动补全或删除。';
      wrap.appendChild(ta);
      const btnRow = document.createElement('div');
      btnRow.className = 'row mt8';
      btnRow.innerHTML = '<button class="btn btn-sm btn-green" id="trTrans">🔍 识别图片中的文字</button><span class="hint">手写体识别需要支持图片理解的模型，在「设置」里填写视觉模型</span>';
      wrap.appendChild(btnRow);
      btnRow.querySelector('#trTrans').onclick = () => this.transcribe();
    }
  },

  fillPassage() {
    const p = APP.bank.passages.find(x => x.id === this.state.pid) || APP.bank.passages[0];
    const el = document.getElementById('trOriginal');
    if (el) el.value = p.text;
    APP.ui.toast('已载入：' + p.title);
  },
  clearOriginal() {
    const el = document.getElementById('trOriginal');
    if (el) { el.value = ''; el.focus(); }
  },

  async transcribe() {
    if (!this.state.imgs.length) { APP.ui.toast('请先上传图片', 'err'); return; }
    if (!APP.ai.ready()) { APP.ui.toast('请先配置 API Key', 'err'); return; }
    APP.ui.loading(true, '正在识别图片文字…', '逐行转录，无法辨认处会标为【?】');
    try {
      const text = await APP.ai.transcribe(this.state.imgs, '这是考研英语二翻译题的手写译文，请把中文译文转录出来。');
      document.getElementById('trStudent').value = text.trim();
      APP.ui.toast('识别完成，请核对', 'ok');
    } catch (e) {
      if (e.message === 'VISION_UNSUPPORTED') {
        APP.ui.toast('当前模型不支持图片识别，请在设置里换用支持视觉的模型，或改用文字输入', 'err');
      } else APP.ui.toast(APP.ai.errMsg(e), 'err');
    } finally { APP.ui.loading(false); }
  },

  collect() {
    const original = (document.getElementById('trOriginal') || {}).value || '';
    const student = (document.getElementById('trStudent') || {}).value || '';
    const note = (document.getElementById('trNote') || {}).value || '';
    return { original: original.trim(), student: student.trim(), note: note.trim() };
  },

  copyRequest() {
    const d = this.collect();
    if (!d.student) { APP.ui.toast('请先输入你的译文', 'err'); return; }
    if (this.state.qimgs.length && !d.original) {
      APP.ui.toast('图片无法随文本复制，请先点「识别图片中的英文原文」', 'err');
      return;
    }
    APP.ui.copy(APP.ai.buildRequest('translation', d));
    if (this.state.qimgs.length) {
      APP.ui.toast('原文已随文本导出；若识别有误，请以你核对后的文字为准', 'ok');
    }
  },

  pasteResult() {
    APP.ui.sheet('粘贴批改结果', `
      <div class="hint mb8">把 AI 返回的 JSON（或文字版批改结果）粘贴到下面，系统会解析并保存。若粘贴的是非 JSON 文本，将作为「总评文本」保存。</div>
      <textarea class="textarea tall" id="pasteBox" placeholder='在此粘贴 JSON…'></textarea>
      <div class="row mt12"><div class="spacer"></div>
        <button class="btn" onclick="APP.ui.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="APP.views.translate.doPaste()">解析并保存</button>
      </div>`, () => { });
  },

  doPaste() {
    const t = document.getElementById('pasteBox').value.trim();
    if (!t) { APP.ui.toast('内容为空', 'err'); return; }
    let data;
    try { data = APP.ai.parseJSON(t); }
    catch (e) {
      data = { band: '外部批改', totalScore: 0, typos: { items: [], count: 0, deduction: 0 }, sentences: [], weaknesses: [], improvedVersion: '', comment: t };
    }
    APP.ui.closeSheet();
    const d = this.collect();
    this.renderResult(data, d, false);
    this.persist(data, d);
  },

  async submit() {
    const d = this.collect();
    if (!d.original) { APP.ui.toast('请填写英文原文', 'err'); return; }
    if (!d.student) { APP.ui.toast('请填写你的译文', 'err'); return; }
    if (!APP.ai.ready()) {
      APP.ui.toast('尚未配置 API Key，已为你生成批改请求', 'err');
      this.copyRequest(); return;
    }
    APP.ui.loading(true);
    try {
      // 若上传了题目图片且配置了视觉模型，会把原图一并交给阅卷老师，转录有误差时也能对准原文
      const data = await APP.ai.gradeTranslation(d.original, d.student, d.note, this.state.qimgs);
      this.renderResult(data, d, true);
      this.persist(data, d);
      APP.ui.toast('批改完成', 'ok');
    } catch (e) {
      APP.ui.toast(APP.ai.errMsg(e), 'err');
    } finally { APP.ui.loading(false); }
  },

  persist(data, d) {
    const title = (APP.bank.passages.find(x => x.text === d.original) || {}).title || '自定义段落';
    APP.store.addRecord({
      type: 'translation', title, score: data.totalScore || 0, full: 15, band: data.band || '',
      data: { result: data, original: d.original, student: d.student, note: d.note, title }
    });
    const tags = (data.weaknesses || []).map(w => w.tag);
    APP.store.addWeaknesses(tags, data.totalScore);
    APP.store.addWrong((data.weaknesses || []).filter(w => w.level === 'high').map(w => ({
      tag: w.tag, title: '【翻译】' + w.tag + '：' + (w.desc || '').slice(0, 40),
      content: w.advice || w.desc, source: title
    })));
    APP.refresh();
  },

  renderResult(data, d, scroll) {
    const box = document.getElementById('trResult');
    if (!box) return;
    box.innerHTML = this.resultHTML(data, d);
    if (scroll) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },

  showResult(payload) {
    if (!payload) return;
    APP.go('translate');
    setTimeout(() => {
      const el = document.getElementById('trOriginal');
      if (el) el.value = payload.original || '';
      const st = document.getElementById('trStudent');
      if (st) st.value = payload.student || '';
      this.renderResult(payload.result, payload, true);
    }, 60);
  },

  showRef() {
    const p = APP.bank.passages.find(x => x.id === this.state.pid);
    if (!p) return;
    APP.ui.sheet('参考译文 · ' + p.title, `
      <div class="hint mb8">先自己动笔再看参考。重点对照：定语从句处理、状语位置、词义选择、中文搭配。</div>
      <div class="q-cn" style="font-size:14.5px">${APP.ui.esc(p.reference)}</div>`, () => { });
  },

  /* ---------------- 结果渲染 ---------------- */
  resultHTML(data, d) {
    const u = APP.ui;
    const ty = data.typos || { items: [], count: 0, deduction: 0 };
    const sents = data.sentences || [];
    const score = Number(data.totalScore || 0);

    return `
      <div class="card card-pad mt16" id="resultCard">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <div class="sec-title" style="margin:0"><span class="dot"></span>批改结果</div>
          <div class="row">
            <button class="btn btn-sm" onclick="APP.views.translate.copyResult()">📋 复制</button>
            <button class="btn btn-sm" onclick="APP.printResult()">🖨️ 打印/存 PDF</button>
          </div>
        </div>

        <div class="score-hero ${u.bandClass(score)}">
          <div class="score-big">
            <div class="num">${score}<span class="den">/15</span></div>
            <div class="band"><span class="tag tag-blue">${u.esc(data.band || '—')}</span></div>
          </div>
          <div class="score-meta">
            <div class="meta-box"><div class="k">句数</div><div class="v">${data.sentenceCount || sents.length} 句</div></div>
            <div class="meta-box"><div class="k">错别字</div><div class="v">${ty.count || 0} 个（扣 ${ty.deduction || 0}）</div></div>
            <div class="meta-box"><div class="k">最高句 / 最低句</div><div class="v">${this.hilo(sents)}</div></div>
            <div class="meta-box"><div class="k">采分点命中</div><div class="v">${this.hitRate(sents)}</div></div>
          </div>
        </div>

        ${data.comment ? `<div class="card card-pad mt12" style="background:var(--panel-2)">
          <div class="sec-title" style="margin-bottom:6px"><span class="dot"></span>阅卷老师总评</div>
          <div style="font-size:14px;line-height:1.8">${u.md(data.comment)}</div>
        </div>` : ''}

        ${(ty.items && ty.items.length) ? `<div class="card card-pad mt12">
          <div class="sec-title"><span class="dot"></span>中文错别字统计</div>
          <div class="row row-wrap">
            ${ty.items.map(t => `<span class="tag tag-red">${u.esc(t.wrong)} → ${u.esc(t.right)}</span>`).join('')}
          </div>
          ${ty.note ? `<div class="hint mt8">${u.esc(ty.note)}</div>` : ''}
        </div>` : ''}

        <div class="card card-pad mt12">
          <div class="sec-title"><span class="dot"></span>逐句批改（按采分点给分）</div>
          ${sents.map(s => this.sentHTML(s)).join('') || u.empty('📄', '没有逐句数据')}
        </div>

        ${(data.weaknesses && data.weaknesses.length) ? `<div class="card card-pad mt12">
          <div class="sec-title"><span class="dot"></span>薄弱点与改进建议</div>
          ${data.weaknesses.map((w, i) => `
            <div class="weak-item">
              <div class="wi-n">${i + 1}</div>
              <div style="flex:1">
                <div class="row row-wrap">
                  <span class="wi-t">${u.esc(w.tag)}</span>
                  <span class="tag ${w.level === 'high' ? 'tag-red' : w.level === 'mid' ? 'tag-orange' : 'tag-blue'}">${w.level === 'high' ? '重点攻克' : w.level === 'mid' ? '需关注' : '了解即可'}</span>
                </div>
                <div class="wi-d">${u.esc(w.desc || '')}</div>
                ${w.advice ? `<div class="wi-d" style="color:var(--green)">👉 ${u.esc(w.advice)}</div>` : ''}
              </div>
            </div>`).join('')}
          <button class="btn btn-green btn-block mt8" onclick="APP.views.train.startByWeak('${u.esc((data.weaknesses[0] || {}).tag || '')}')">🎯 针对薄弱点出一套训练</button>
        </div>` : ''}

        ${data.improvedVersion ? `<div class="card card-pad mt12">
          <div class="sec-title"><span class="dot"></span>润色后的完整译文</div>
          <div class="q-cn" style="font-size:14.5px">${u.esc(data.improvedVersion)}</div>
        </div>` : ''}
      </div>`;
  },

  sentHTML(s) {
    const u = APP.ui;
    const pct = s.maxScore ? Math.round((s.score / s.maxScore) * 100) : 0;
    const kps = s.keyPoints || [];
    return `
      <div class="sent-item">
        <div class="sent-head">
          <div class="sent-idx">${s.index}</div>
          <div class="sent-src">${u.esc(s.source)}</div>
          <div class="sent-score">${s.score} / ${s.maxScore}</div>
        </div>
        <div class="sent-body">
          <div class="sent-line">
            <div class="k">📄 英文原句</div>
            <div class="v en">${u.esc(s.source)}</div>
          </div>
          <div class="sent-line">
            <div class="k">✍️ 我的译文</div>
            <div class="v ${(s.score / (s.maxScore || 1)) >= .7 ? 'good' : 'bad'}">${u.esc(s.student || '（未作答）')}</div>
          </div>
          ${kps.length ? `<div class="sent-line">
            <div class="k">🎯 采分点（${kps.filter(k => k.level === 'hit').length}/${kps.length} 命中）</div>
            <div class="kp-list">
              ${kps.map(k => `
                <div class="kp ${k.level}">
                  <span class="kp-i">${k.level === 'hit' ? '命中' : k.level === 'partial' ? '部分' : '未中'}</span>
                  <div class="kp-t"><div>${u.esc(k.point)}</div>${k.note ? `<div class="kp-n">${u.esc(k.note)}</div>` : ''}</div>
                </div>`).join('')}
            </div>
          </div>` : ''}
          <div class="sent-line">
            <div class="k">📌 扣分原因</div>
            <div class="v ${s.deductionReason && s.deductionReason !== '无' ? 'bad' : 'good'}">${u.esc(s.deductionReason || '无')}</div>
          </div>
          <div class="sent-line">
            <div class="k">✅ 参考佳译</div>
            <div class="v good">${u.esc(s.reference || '')}</div>
          </div>
          ${s.betterVersion ? `<div class="sent-line">
            <div class="k">💡 类似语句如何翻译为佳</div>
            <div class="v">${u.esc(s.betterVersion)}</div>
          </div>` : ''}
          ${s.note ? `<div class="sent-line">
            <div class="k">🗣️ 点评</div>
            <div class="v">${u.esc(s.note)}</div>
          </div>` : ''}
          <div class="bar ${u.barClass(s.score, s.maxScore)}"><i style="width:${pct}%"></i></div>
        </div>
      </div>`;
  },

  hilo(sents) {
    if (!sents.length) return '—';
    const sc = sents.map(s => s.score);
    return Math.max.apply(null, sc) + ' / ' + Math.min.apply(null, sc);
  },
  hitRate(sents) {
    let hit = 0, total = 0;
    sents.forEach(s => (s.keyPoints || []).forEach(k => { total++; if (k.level === 'hit') hit++; else if (k.level === 'partial') hit += .5; }));
    if (!total) return '—';
    return hit + ' / ' + total;
  },

  copyResult() {
    const el = document.getElementById('resultCard');
    if (!el) return;
    APP.ui.copy(el.innerText.replace(/\n{3,}/g, '\n\n').trim());
  }
};

</script>
<!-- ===== assets/js/views/essay.js ===== -->
<script>
/* ============================================================
 *  views/essay.js —— 大作文批改（15 分）
 * ============================================================ */
window.APP = window.APP || {}; APP.views = APP.views || {};

APP.views.essay = {
  title: '作文批改', sub: '图表大作文 · 四维评分 · 15 分制', icon: '📊',

  state: { cid: '', mode: 'text', imgs: [], chartImgs: [] },

  render(root) {
    const c = APP.bank.charts;
    const cur = c.find(x => x.id === this.state.cid) || c[0];
    this.state.cid = cur.id;

    root.innerHTML = `
      <div class="card card-pad">
        <div class="sec-title"><span class="dot"></span>第一步 · 确定作文题目</div>
        <div class="row row-wrap">
          <select class="select" id="esCid" style="max-width:340px">
            ${c.map(x => `<option value="${x.id}"${x.id === cur.id ? ' selected' : ''}>${APP.ui.esc(x.type)} · ${APP.ui.esc(x.title)}</option>`).join('')}
          </select>
          <button class="btn btn-sm" onclick="APP.views.essay.fillChart()">载入题目</button>
          <button class="btn btn-sm" onclick="APP.views.essay.clearPrompt()">清空自定义</button>
        </div>
        <div id="esChartBox" class="mt12">${this.chartHTML(cur)}</div>
        <div class="field mt12">
          <div class="label">题目指令与图表说明 <span class="hint">（会一并发给阅卷老师；可自行替换为真题/模考卷）</span></div>
          <textarea class="textarea" id="esPrompt" style="min-height:150px"></textarea>
        </div>
        <div class="field">
          <div class="label">图表图片 <span class="hint">（可选；纸质试卷拍照上传后，原图会随批改请求一并发给阅卷老师，需视觉模型支持，见「设置」）</span></div>
          <div id="esChartUpload"></div>
        </div>
      </div>

      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>第二步 · 提交你的作文</div>
        <div class="mode-switch">
          <button id="meText" class="active" onclick="APP.views.essay.setMode('text')">⌨️ 直接输入文字</button>
          <button id="meImg" onclick="APP.views.essay.setMode('img')">🖼️ 上传手写图片</button>
        </div>
        <div id="esInputBox"></div>
        <div class="row row-wrap" style="margin-top:8px">
          <span class="tag" id="esWc">英文词数：0</span>
          <span class="hint">题目要求约 150 词时，130-180 词都比较稳妥，不必机械凑数。</span>
        </div>
        <div class="field mt12">
          <div class="label">补充说明 <span class="hint">（可选）</span></div>
          <input class="input" id="esNote" placeholder="例如：请重点看我的评论段是否跑题">
        </div>
        <div class="row row-wrap mt8">
          <button class="btn btn-primary" onclick="APP.views.essay.submit()">📮 提交批改</button>
          <button class="btn" onclick="APP.views.essay.copyRequest()">📋 复制批改请求</button>
          <button class="btn" onclick="APP.views.essay.pasteResult()">📥 粘贴批改结果</button>
        </div>
      </div>

      <div id="esResult"></div>`;

    document.getElementById('esPrompt').value = this.promptText(cur);
    document.getElementById('esCid').onchange = e => {
      this.state.cid = e.target.value;
      const nc = APP.bank.charts.find(x => x.id === this.state.cid);
      document.getElementById('esChartBox').innerHTML = this.chartHTML(nc);
      document.getElementById('esPrompt').value = this.promptText(nc);
    };

    const cu = APP.ui.uploader({ onChange: f => { this.state.chartImgs = f; } });
    document.getElementById('esChartUpload').appendChild(cu.el);

    this.setMode(this.state.mode);
  },

  promptText(c) {
    return `【图表类型】${c.type}\n【图表标题】${c.title}\n【英文题干】${c.desc}\n【单位】${c.unit}\n\n【数据】\n${c.data.map(r => r.join('：')).join('\n')}\n\n【写作任务】${c.task}\n【字数要求】约 150 词\n\n【本题提醒】${c.tips}`;
  },

  chartHTML(c) {
    const isTable = c.type === '表格';
    let head = '', body = '';
    if (isTable) {
      head = '<tr><th>通勤方式</th><th>平均耗时</th><th>月均成本</th><th>舒适度</th><th>碳排放</th></tr>';
      body = c.data.map(r => '<tr>' + r.map(x => '<td>' + APP.ui.esc(x) + '</td>').join('') + '</tr>').join('');
    } else {
      head = '<tr><th>' + (c.type === '折线图' ? '时间' : '项目') + '</th>' + c.data[0].slice(1).map((_, i) => '<th>' + (i === 0 ? c.unit : '系列' + (i + 1)) + '</th>').join('') + '</tr>';
      body = c.data.map(r => '<tr>' + r.map(x => '<td>' + APP.ui.esc(x) + '</td>').join('') + '</tr>').join('');
    }
    return `<div class="chart-box">
      <div class="row row-wrap" style="justify-content:space-between">
        <div class="chart-title">${APP.ui.esc(c.title)}</div>
        <span class="tag tag-purple">${APP.ui.esc(c.type)}</span>
      </div>
      <div class="hint">${APP.ui.esc(c.desc)}</div>
      <table class="data-tb"><thead>${head}</thead><tbody>${body}</tbody></table>
      <div class="hint mt8">💡 ${APP.ui.esc(c.tips)}</div>
    </div>`;
  },

  setMode(m) {
    this.state.mode = m;
    const box = document.getElementById('esInputBox');
    if (!box) return;
    ['meText', 'meImg'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('active', id === ('me' + m[0].toUpperCase() + m.slice(1)));
    });
    box.innerHTML = '';
    if (m === 'text') {
      const ta = document.createElement('textarea');
      ta.className = 'textarea en tall';
      ta.id = 'esEssay';
      ta.placeholder = '在此输入你的英文作文…';
      ta.oninput = () => this.updateWC();
      box.appendChild(ta);
    } else {
      const wrap = document.createElement('div');
      box.appendChild(wrap);
      const up = APP.ui.uploader({ onChange: f => { this.state.imgs = f; } });
      wrap.appendChild(up.el);
      const ta = document.createElement('textarea');
      ta.className = 'textarea en tall mt12';
      ta.id = 'esEssay';
      ta.placeholder = '图片转录结果会出现在这里。无法辨认处 AI 会标为【?】，请先补全再批改，不要让它被当成拼写错误。';
      ta.oninput = () => this.updateWC();
      wrap.appendChild(ta);
      const btnRow = document.createElement('div');
      btnRow.className = 'row mt8';
      btnRow.innerHTML = '<button class="btn btn-sm btn-green" id="esTrans">🔍 识别图片中的作文</button>';
      wrap.appendChild(btnRow);
      btnRow.querySelector('#esTrans').onclick = () => this.transcribe();
    }
    this.updateWC();
  },

  updateWC() {
    const el = document.getElementById('esEssay');
    const tag = document.getElementById('esWc');
    if (!el || !tag) return;
    const n = (el.value.match(/[A-Za-z][A-Za-z'-]*/g) || []).length;
    tag.textContent = '英文词数：' + n;
    tag.className = 'tag ' + (n >= 130 && n <= 190 ? 'tag-green' : n > 0 ? 'tag-orange' : '');
  },

  async transcribe() {
    if (!this.state.imgs.length) { APP.ui.toast('请先上传图片', 'err'); return; }
    if (!APP.ai.ready()) { APP.ui.toast('请先配置 API Key', 'err'); return; }
    APP.ui.loading(true, '正在识别手写作文…', '无法辨认处会标为【?】，请核对');
    try {
      const text = await APP.ai.transcribe(this.state.imgs, '这是考研英语二大作文的手写稿，请把英文作文转录出来。');
      document.getElementById('esEssay').value = text.trim();
      this.updateWC();
      APP.ui.toast('识别完成，请核对', 'ok');
    } catch (e) {
      APP.ui.toast(e.message === 'VISION_UNSUPPORTED' ? '当前模型不支持图片识别，请在设置里换用视觉模型' : APP.ai.errMsg(e), 'err');
    } finally { APP.ui.loading(false); }
  },

  fillChart() {
    const c = APP.bank.charts.find(x => x.id === this.state.cid);
    document.getElementById('esPrompt').value = this.promptText(c);
    document.getElementById('esChartBox').innerHTML = this.chartHTML(c);
    APP.ui.toast('已载入题目');
  },
  clearPrompt() { const el = document.getElementById('esPrompt'); if (el) { el.value = ''; el.focus(); } },

  collect() {
    return {
      promptText: (document.getElementById('esPrompt') || {}).value || '',
      essay: (document.getElementById('esEssay') || {}).value || '',
      note: (document.getElementById('esNote') || {}).value || ''
    };
  },

  copyRequest() {
    const d = this.collect();
    if (!d.essay) { APP.ui.toast('请先输入作文', 'err'); return; }
    APP.ui.copy(APP.ai.buildRequest('essay', d));
  },

  pasteResult() {
    APP.ui.sheet('粘贴批改结果', `
      <div class="hint mb8">把 AI 返回的 JSON 粘贴到下面；非 JSON 文本将作为总评保存。</div>
      <textarea class="textarea tall" id="pasteBox2" placeholder='在此粘贴 JSON…'></textarea>
      <div class="row mt12"><div class="spacer"></div>
        <button class="btn" onclick="APP.ui.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="APP.views.essay.doPaste()">解析并保存</button>
      </div>`);
  },
  doPaste() {
    const t = document.getElementById('pasteBox2').value.trim();
    if (!t) { APP.ui.toast('内容为空', 'err'); return; }
    let data;
    try { data = APP.ai.parseJSON(t); }
    catch (e) { data = { band: '外部批改', totalScore: 0, comment: t, lines: [], issues: [], expressions: [] }; }
    APP.ui.closeSheet();
    const d = this.collect();
    this.renderResult(data, d);
    this.persist(data, d);
  },

  async submit() {
    const d = this.collect();
    if (!d.essay.trim()) { APP.ui.toast('请填写你的作文', 'err'); return; }
    if (!APP.ai.ready()) { APP.ui.toast('尚未配置 API Key，已为你生成批改请求', 'err'); this.copyRequest(); return; }
    APP.ui.loading(true, '阅卷老师正在批改…', '核对要点、语言与结构');
    try {
      // 若上传了图表图片且配置了视觉模型，原图会一并交给阅卷老师，避免转录误差
      const data = await APP.ai.gradeEssay(d.promptText, d.essay, d.note, this.state.chartImgs);
      this.renderResult(data, d);
      this.persist(data, d);
      APP.ui.toast('批改完成', 'ok');
    } catch (e) { APP.ui.toast(APP.ai.errMsg(e), 'err'); }
    finally { APP.ui.loading(false); }
  },

  persist(data, d) {
    const t = (d.promptText.split('\n')[1] || '自定义题目').replace('【图表标题】', '');
    APP.store.addRecord({
      type: 'essay', title: t, score: data.totalScore || 0, full: 15, band: data.band || '',
      data: { result: data, promptText: d.promptText, essay: d.essay, note: d.note, title: t }
    });
    const tags = (data.issues || []).slice(0, 3).map(i => this.guessTag(i.title + ' ' + i.detail));
    APP.store.addWeaknesses(tags, data.totalScore);
    APP.store.addWrong((data.issues || []).map(i => ({
      tag: this.guessTag(i.title + ' ' + i.detail), title: '【作文】' + (i.title || '待改进'),
      content: i.detail, source: t
    })));
    APP.refresh();
  },

  guessTag(text) {
    const map = [
      ['百分比|百分点', '静态/动态混淆'], ['趋势', '趋势表达'], ['比例|占比|percent', '比例表达'],
      ['数据|数值|单位', '图表数据描述'], ['衔接|连贯|层次|分段', '衔接与层次'],
      ['词汇|用词|搭配', '词汇准确性'], ['语法|时态|单复数|主谓', '语法错误'],
      ['句式|句型|多样', '句式多样性'], ['评论|观点|跑题', '评论段逻辑'], ['词数', '词数控制']
    ];
    for (const [re, tag] of map) if (new RegExp(re).test(text)) return tag;
    return '语言准确性';
  },

  renderResult(data, d) {
    const box = document.getElementById('esResult');
    if (!box) return;
    box.innerHTML = this.resultHTML(data, d);
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },

  showResult(payload) {
    if (!payload) return;
    APP.go('essay');
    setTimeout(() => {
      const p = document.getElementById('esPrompt'); if (p) p.value = payload.promptText || '';
      const e = document.getElementById('esEssay'); if (e) e.value = payload.essay || '';
      this.updateWC();
      this.renderResult(payload.result, payload);
    }, 60);
  },

  resultHTML(data, d) {
    const u = APP.ui;
    const score = Number(data.totalScore || 0);
    const lines = data.lines || [];
    const must = lines.filter(l => l.level === 'must');

    return `
      <div class="card card-pad mt16" id="resultCard2">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <div class="sec-title" style="margin:0"><span class="dot"></span>批改结果</div>
          <div class="row">
            <button class="btn btn-sm" onclick="APP.views.essay.copyResult()">📋 复制</button>
            <button class="btn btn-sm" onclick="APP.printResult()">🖨️ 打印/存 PDF</button>
          </div>
        </div>

        <div class="score-hero ${u.bandClass(score)}">
          <div class="score-big">
            <div class="num">${score}<span class="den">/15</span></div>
            <div class="band"><span class="tag tag-blue">${u.esc(data.band || '—')}</span></div>
          </div>
          <div class="score-meta">
            <div class="meta-box"><div class="k">英文词数</div><div class="v">${data.wordCount != null ? data.wordCount : '—'} 词</div></div>
            <div class="meta-box"><div class="k">必须修改</div><div class="v">${must.length} 处</div></div>
            <div class="meta-box"><div class="k">可选优化</div><div class="v">${lines.length - must.length} 处</div></div>
            <div class="meta-box"><div class="k">必改密度</div><div class="v">${this.density(must.length, data.wordCount)}</div></div>
          </div>
        </div>

        <div class="card card-pad mt12" style="background:var(--panel-2)">
          <div class="sec-title" style="margin-bottom:8px"><span class="dot"></span>① 整体评分依据</div>
          ${this.dimRow('内容', data.content)}
          ${this.dimRow('语言', data.language)}
          ${this.dimRow('结构', data.structure)}
          ${data.comment ? `<div style="font-size:14px;line-height:1.8;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">${u.md(data.comment)}</div>` : ''}
        </div>

        <div class="card card-pad mt12">
          <div class="sec-title"><span class="dot"></span>② 逐句批改（原句 — 修改句 — 中文解释）</div>
          <div class="row row-wrap mb8">
            <span class="tag tag-red">必须修改 ${must.length}</span>
            <span class="tag tag-orange">可选优化 ${lines.length - must.length}</span>
            <span class="tag tag-blue">数据/趋势问题 ${lines.filter(l => l.issue === 'data' || l.issue === 'trend').length}</span>
          </div>
          ${lines.map(l => this.lineHTML(l)).join('') || u.empty('📄', '没有逐句数据')}
        </div>

        ${data.revisedEssay ? `<div class="card card-pad mt12">
          <div class="sec-title"><span class="dot"></span>③ 修改后全文（<b>加粗</b>为主要修改处）</div>
          <div class="q-en" style="font-size:14.5px;white-space:pre-wrap">${u.escB(data.revisedEssay)}</div>
        </div>` : ''}

        ${(data.issues || data.expressions || data.strategy) ? `<div class="card card-pad mt12">
          <div class="sec-title"><span class="dot"></span>④ 复盘积累</div>
          ${(data.issues && data.issues.length) ? `<div class="mb8" style="font-size:13.5px;font-weight:700">🔧 最需要改进的 ${data.issues.length} 个问题</div>
          ${data.issues.map((i, n) => `<div class="weak-item"><div class="wi-n">${n + 1}</div><div style="flex:1"><div class="wi-t">${u.esc(i.title)}</div><div class="wi-d">${u.esc(i.detail)}</div></div></div>`).join('')}` : ''}

          ${(data.expressions && data.expressions.length) ? `<div class="mt16 mb8" style="font-size:13.5px;font-weight:700">📚 实用表达（${data.expressions.length} 条）</div>
          ${data.expressions.map(e => `<div class="exp-item">
            <div class="e">${u.esc(e.expr)}</div>
            <div class="m"><b>含义：</b>${u.esc(e.meaning || '')}</div>
            <div class="m"><b>用法：</b>${u.esc(e.usage || '')}</div>
          </div>`).join('')}` : ''}

          ${data.strategy ? `<div class="mt16 mb8" style="font-size:13.5px;font-weight:700">🧭 同类题写作思路与可替换框架</div>
          <div class="q-cn" style="font-size:14px">${u.md(data.strategy)}</div>` : ''}

          <button class="btn btn-green btn-block mt12" onclick="APP.views.train.startByWeak('${u.esc(this.guessTag(((data.issues || [])[0] || {}).title || ''))}')">🎯 针对本轮问题出一套训练</button>
        </div>` : ''}
      </div>`;
  },

  dimRow(k, v) {
    return `<div style="margin-bottom:8px">
      <div style="font-size:12.5px;font-weight:700;color:var(--text-3);margin-bottom:2px">${k}</div>
      <div style="font-size:14px;line-height:1.75">${APP.ui.md(v || '—')}</div>
    </div>`;
  },

  lineHTML(l) {
    const u = APP.ui;
    const must = l.level === 'must';
    const issueMap = {
      grammar: '语法', data: '数据', trend: '趋势', word: '用词', cohesion: '衔接', style: '表达'
    };
    return `<div class="essay-line">
      <span class="fl">
        <span class="${must ? 'must' : 'opt'}">${must ? '● 必须修改' : '○ 可选优化'}</span>
        ${l.issue ? ` · <span class="tag ${l.issue === 'data' || l.issue === 'trend' ? 'tag-red' : 'tag-blue'}">${issueMap[l.issue] || l.issue}</span>` : ''}
      </span>
      <div class="orig">${u.esc(l.original)}</div>
      <div class="fix" style="margin-top:6px">${u.escB(l.fixed)}</div>
      <div class="cn">${u.md(l.explain)}</div>
    </div>`;
  },

  density(n, wc) {
    if (!wc) return '—';
    const per = (n / wc) * 100;
    return per.toFixed(1) + ' 处/百词';
  },

  copyResult() {
    const el = document.getElementById('resultCard2');
    if (el) APP.ui.copy(el.innerText.replace(/\n{3,}/g, '\n\n').trim());
  }
};

</script>

      descAI: '给出一组打乱顺序的句子/要点（描述段或评论段），要求考生排出合理顺序并补上衔接，形成连贯段落。'

    {
      id: 'e_comment', group: '作文', icon: '💡', color: 'var(--red-l)',
      name: '评论角度训练',
      desc: '给图表主题，用中文列 3 个评论角度并各写一句论点。解决评论段无话可说。',
      descAI: '给出图表主题，要求考生用中文列出 3 个评论角度，每个角度配一句明确的中心论点句；评分关注相关性、逻辑性与可展开性，并提醒合理推测不能写成图表已证明的事实。'
    },
    {
      id: 'e_full', group: '作文', icon: '📝', color: 'var(--primary-l)',
      name: '整篇限时训练',
      desc: '完整图表作文，约 150 词，30 分钟。用于阶段性检测。',
      descAI: '给出一道完整的图表作文题（含完整数据与写作任务），要求写一篇约 150 词的英文作文。'
    }
  ],

  /* ---------------- 主菜单 ---------------- */
  render(root) {
    const weak = APP.store.topWeaknesses(8);
    const hist = APP.store.getRecords('training');
    const T = this.TYPES;

    root.innerHTML = `
      <div class="card card-pad">
        <div class="sec-title"><span class="dot"></span>从薄弱点直接开练</div>
        ${weak.length ? `<div class="row row-wrap">
          ${weak.map(w => `<button class="btn btn-sm btn-outline" onclick="APP.views.train.startByWeak('${APP.ui.esc(w.tag)}')">${APP.ui.esc(w.tag)} <span class="tag tag-orange">${w.count}</span></button>`).join('')}
        </div>` : `<div class="hint">还没有薄弱点数据。先做一次翻译或作文批改，系统会自动为你画像。</div>`}
      </div>

      <div class="sec-title mt20"><span class="dot"></span>翻译专项（5 练）</div>
      <div class="grid g3">
        ${T.filter(t => t.group === '翻译').map(t => this.cardHTML(t)).join('')}
      </div>

      <div class="sec-title mt20"><span class="dot"></span>作文专项（6 练）</div>
      <div class="grid g3">
        ${T.filter(t => t.group === '作文').map(t => this.cardHTML(t)).join('')}
      </div>

      <div class="card card-pad mt20">
        <div class="sec-title"><span class="dot"></span>训练设计思路</div>
        <div class="grid g2">
          <div>
            <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">翻译：从"看得懂"到"拿得到分"</div>
            <div class="hint">
              单句精译练输出，采分点拆解练"阅卷视角"，回译练搭配，改错练识别问题，长难句切分练结构分析。
              五练闭环，比反复刷整篇翻译更有效率。
            </div>
          </div>
          <div>
            <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">作文：先走对，再写好</div>
            <div class="hint">
              很多人一上来就写英文，结果"信息都没说全"。所以基础层先用中文描述图表，把对象、单位、趋势、排序说清楚；
              提高层再把中文信息点转成英文；最后才是句式升级与整篇输出。
            </div>
          </div>
        </div>
      </div>

      ${hist.length ? `<div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>训练历史</div>
        ${hist.slice(0, 8).map(r => `<div class="list-item" style="margin-bottom:8px">
          <div class="li-main"><div class="li-t">${APP.ui.esc(r.title)}</div><div class="li-d">${APP.ui.timeAgo(r.createdAt)} · ${APP.ui.esc((r.data && r.data.summary || '').slice(0, 40))}</div></div>
          <span class="score-pill ${APP.ui.pillClass(r.score / 100 * 15)}">${r.score}</span>
          <button class="icon-btn" onclick="APP.views.train.showResult(APP.store.getRecord('${r.id}').data, '${APP.ui.esc(r.title)}')">›</button>
        </div>`).join('')}
      </div>` : ''}`;
  },

  cardHTML(t) {
    return `<div class="train-card">
      <div class="tc-top">
        <div class="tc-ico" style="background:${t.color}">${t.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="tc-t">${t.name}</div>
          <div class="tc-d">${t.desc}</div>
        </div>
      </div>
      <div class="tc-foot">
        <span class="tag tag-blue">${t.group}</span>
        <div class="row">
          <button class="btn btn-sm" onclick="APP.views.train.start('${t.id}', true)">AI 出题</button>
          <button class="btn btn-sm btn-primary" onclick="APP.views.train.start('${t.id}', false)">内置题</button>
        </div>
      </div>
    </div>`;
  },

  /* ---------------- 出题 ---------------- */
  async start(typeId, useAI, weakTag) {
    const t = this.TYPES.find(x => x.id === typeId);
    if (!t) return;
    APP.ui.loading(true, useAI ? '正在出题…' : '正在组卷…', t.name);
    try {
      let quiz;
      if (useAI) {
        if (!APP.ai.ready()) { APP.ui.loading(false); APP.ui.toast('请先配置 API Key，或改用「内置题」', 'err'); return; }
        const w = weakTag ? [weakTag] : APP.store.topWeaknesses(4).map(x => x.tag);
        const data = await APP.ai.genTraining(t.name, t.descAI, w, '考研英语二', this.countOf(typeId));
        quiz = { title: data.title || t.name, intro: data.intro || t.desc, items: data.items || [], typeId, typeName: t.name, fromAI: true };
      } else {
        quiz = this.localGen(typeId, t, weakTag);
        quiz.typeId = typeId; quiz.typeName = t.name; quiz.fromAI = false;
      }
      if (!quiz.items || !quiz.items.length) throw new Error('EMPTY');
      this.state.quiz = quiz;
      this.state.answers = {};
      this.renderQuiz(quiz);
    } catch (e) {
      APP.ui.toast(APP.ai.errMsg(e), 'err');
    } finally { APP.ui.loading(false); }
  },

  startByWeak(tag) {
    if (!tag) return;
    const map = {
      '图表数据描述': 'e_describe_cn', '趋势表达': 'e_cn2en', '比例表达': 'e_cn2en',
      '静态/动态混淆': 'e_describe_cn', '评论段逻辑': 'e_comment', '衔接与层次': 'e_assemble',
      '句式多样性': 'e_upgrade', '词汇准确性': 'e_cn2en', '语法错误': 'e_upgrade', '词数控制': 'e_full',
      '定语从句': 't_sentence', '状语从句': 't_sentence', '被动语态': 't_sentence',
      '形式主语': 't_sentence', '比较结构': 't_sentence', '插入语': 't_sentence',
      '长难句拆分': 't_split', '词义选择': 't_fixer', '增词减词': 't_fixer',
      '语序调整': 't_backtrans', '时态语气': 't_sentence'
    };
    const tid = map[tag] || (this.isTransTag(tag) ? 't_sentence' : 'e_describe_cn');
    const useAI = APP.ai.ready();
    APP.go('train');
    setTimeout(() => this.start(tid, useAI, tag), 50);
  },

  isTransTag(tag) {
    return ['定语从句', '状语从句', '被动语态', '形式主语', '比较结构', '插入语', '长难句拆分', '词义选择', '增词减词', '语序调整', '时态语气'].indexOf(tag) >= 0;
  },

  countOf(typeId) {
    return ({ t_sentence: 4, t_keypoint: 3, t_backtrans: 4, t_fixer: 3, t_split: 3, e_describe_cn: 2, e_cn2en: 5, e_upgrade: 5, e_assemble: 2, e_comment: 2, e_full: 1 })[typeId] || 3;
  },

  /* ---------------- 内置出题（无需 API） ---------------- */
  localGen(typeId, t, weakTag) {
    const B = APP.bank;
    const pick = (arr, n, filterCat) => {
      let pool = arr;
      if (filterCat && weakTag) {
        const f = arr.filter(x => x.cat === weakTag);
        if (f.length) pool = f;
      }
      const shuffled = pool.slice().sort(() => Math.random() - 0.5);
      return shuffled.slice(0, n);
    };
    const items = [];
    let i = 1;

    if (typeId === 't_sentence') {
      pick(B.sentences, 4, true).forEach(s => items.push({
        id: i++, stem: s.en, hint: '结构：' + s.cat,
        reference: s.cn,
        points: ['关键结构（' + s.cat + '）是否译对', '有无漏译', '中文表达是否通顺自然']
      }));
      return { title: '单句精译 · 内置题', intro: '逐句翻译成中文。写完再对照参考答案，重点看结构处理与词义选择。' , items };
    }

    if (typeId === 't_keypoint') {
      pick(B.sentences.filter(s => s.cat === '长难句综合'), 3).concat(pick(B.sentences, 3)).slice(0, 3).forEach(s => items.push({
        id: i++, stem: s.en,
        hint: '请先写出 3-4 个采分点，再逐点翻译。',
        reference: s.cn,
        points: ['采分点划分是否合理（3-4 个）', '每个采分点是否译对', '连成整句后中文是否通顺']
      }));
      return { title: '采分点拆解 · 内置题', intro: '先划采分点，再逐点翻译。这是阅卷老师看一句话的方式。', items };
    }

    if (typeId === 't_backtrans') {
      pick(B.sentences, 4, true).forEach(s => items.push({
        id: i++, stem: s.cn, hint: '回写成英文，尽量贴近地道表达。',
        reference: s.en,
        points: ['主要结构是否与原文一致', '搭配是否地道', '时态/单复数/冠词是否正确']
      }));
      return { title: '回译训练 · 内置题', intro: '把中文回写成英文，再与原文逐词对照，找出你的"中式"之处。', items };
    }

    if (typeId === 't_split') {
      pick(B.sentences.filter(s => s.cat === '长难句综合'), 3).forEach(s => items.push({
        id: i++,
        stem: s.en,
        hint: '用「/」划分意群，用【】标出主干（主谓宾），再给出译文。',
        reference: s.cn,
        points: ['主干识别是否正确', '修饰成分归属是否清楚', '译文是否按中文习惯重组语序']
      }));
      return { title: '长难句切分 · 内置题', intro: '先切分，再翻译。切不开就不要硬译。', items };
    }

    if (typeId === 'e_describe_cn') {
      const c = B.charts[Math.floor(Math.random() * B.charts.length)];
      items.push({
        id: 1,
        stem: `【${c.type}】${c.title}\n单位：${c.unit}\n\n数据：\n${c.data.map(r => r.join('：')).join('\n')}\n\n任务：${c.task}\n\n请用中文完整描述这张图表（150-220 字）：说清对象、时间、单位、关键数值、比例或排序、变化趋势。`,
        hint: c.tips,
        reference: this.describeReference(c),
        points: ['是否说清对象与时间', '是否写明单位', '是否抓住关键数值/比例/排序', '趋势描述是否准确（静态对比 ≠ 时间变化）', '是否编造了图表没有的信息']
      });
      return { title: '图表信息描述 · ' + c.title, intro: '先别写英文。用中文把信息说全、说准，这一步决定你作文的上限。', items };
    }

    if (typeId === 'e_cn2en') {
      const c = B.charts[Math.floor(Math.random() * B.charts.length)];
      this.cnInfoPoints(c).slice(0, 5).forEach(p => items.push({
        id: i++, stem: p.cn, hint: '写成一句地道准确的英文。',
        reference: p.en,
        points: ['数据/比例/趋势表达是否准确', '语法与搭配是否正确', '是否自然，不像中式直译']
      }));
      return { title: '信息点英译 · ' + c.title, intro: '把中文信息点写成英文句子。写完对照，重点看介词、倍数与趋势动词。', items };
    }

    if (typeId === 'e_upgrade') {
      pick(this.UPGRADE, 5).forEach(u => items.push({
        id: i++, stem: u.plain, hint: u.hint || '改写为更准确、更自然的表达。',
        reference: u.better,
        points: ['是否修正了原句的问题', '表达是否更准确自然', '是否过度堆砌生僻词（不提倡）']
      }));
      return { title: '句式升级 · 内置题', intro: '升级不等于堆难词。先准确，再自然，最后才是层次感。', items };
    }

    if (typeId === 'e_assemble') {
      pick(this.ASSEMBLE, 2).forEach(a => items.push({
        id: i++, stem: a.stem, hint: '排出合理顺序，并补上必要的衔接词，写成连贯的一段。',
        reference: a.reference,
        points: ['顺序是否符合"总—分—总"或"现象—原因—评价"逻辑', '衔接是否自然', '是否有层次感']
      }));
      return { title: '段落拼装 · 内置题', intro: '顺序错了，再好的句子也不连贯。练的是逻辑与衔接。', items };
    }

    if (typeId === 'e_comment') {
      const c = B.charts[Math.floor(Math.random() * B.charts.length)];
      items.push({
        id: 1,
        stem: `图表主题：${c.title}\n\n请用中文列出 3 个评论角度，每个角度配一句明确的中心论点（可直接展开成英文段落）。\n要求：角度必须与图表相关、彼此不重复、且每个都能展开 2-3 句。`,
        hint: '提示：可从原因、影响、应对建议三个层面切入；推测要用"可能/或许"，不要写成图表已证明的事实。',
        reference: this.commentReference(c),
        points: ['三个角度是否与图表主题相关', '角度之间是否重复', '每个论点是否明确可展开', '是否把推测写成了确定的事实']
      });
      return { title: '评论角度训练 · ' + c.title, intro: '评论段无话可说，往往是角度没选对。先把角度和论点想清楚。', items };
    }

    // e_full
    const c2 = B.charts[Math.floor(Math.random() * B.charts.length)];
    items.push({
      id: 1,
      stem: `【${c2.type}】${c2.title}\n${c2.desc}\n单位：${c2.unit}\n\n数据：\n${c2.data.map(r => r.join('：')).join('\n')}\n\n任务：${c2.task}\n字数：约 150 词，限时 30 分钟。`,
      hint: c2.tips,
      reference: this.fullReference(c2),
      points: ['描述段是否覆盖主要特征与关键对比', '评论段是否相关且充分', '语言准确性与丰富度', '结构与衔接', '词数是否合适']
    });
    return { title: '整篇限时训练 · ' + c2.title, intro: '限时 30 分钟完成，之后可到「作文批改」里做精细批改。', items };
  },

  describeReference(c) {
    const d = c.data;
    if (c.type === '折线图') {
      const first = d[0], last = d[d.length - 1];
      return `参考要点：本图为动态变化图，时间跨度为 ${first[0]} 至 ${last[0]}。首项（${first[0]}）为 ${first[1]}，末项（${last[0]}）为 ${last[1]}，整体呈上升趋势，共上升 ${Number(last[1]) - Number(first[1])} ${c.unit.indexOf('百分比') >= 0 ? '个百分点' : c.unit}。其中某一段上升最快，应单独指出。注意：这是"个百分点"而非"百分比"。`;
    }
    const sorted = d.slice().sort((a, b) => Number(b[1]) - Number(a[1]));
    return `参考要点：本图为静态对比图。占比/数值最高的是「${sorted[0][0]}」（${sorted[0][1]}），最低的是「${sorted[sorted.length - 1][0]}」（${sorted[sorted.length - 1][1]}），两者相差 ${(Number(sorted[0][1]) - Number(sorted[sorted.length - 1][1])).toFixed(1)} ${c.unit.indexOf('百分比') >= 0 ? '个百分点' : c.unit}。应按高低顺序描述，突出 2-3 个关键对比即可，不必罗列所有数字。切勿把类别差异写成"逐年上升"。`;
  },

  cnInfoPoints(c) {
    const d = c.data, out = [];
    if (c.type === '折线图') {
      const a = d[0], b = d[d.length - 1];
      out.push({ cn: `该比例从 ${a[0]} 年的 ${a[1]}% 上升到 ${b[0]} 年的 ${b[1]}%，上升了 ${Number(b[1]) - Number(a[1])} 个百分点。`, en: `The proportion rose from ${a[1]}% in ${a[0]} to ${b[1]}% in ${b[0]}, an increase of ${Number(b[1]) - Number(a[1])} percentage points.` });
      out.push({ cn: '整体呈持续上升趋势，其中中间阶段增长最为明显。', en: 'Overall, the figure followed a steady upward trend, with the sharpest growth occurring in the middle period.' });
      out.push({ cn: '尽管增速在后期有所放缓，但仍保持在较高水平。', en: 'Although the pace of growth slowed somewhat later on, the figure remained at a relatively high level.' });
      out.push({ cn: '这一变化可能与该时期就业压力增大有关。', en: 'This change may be attributed to the growing pressure of finding a decent job during that period.' });
    } else {
      const s = d.slice().sort((x, y) => Number(y[1]) - Number(x[1]));
      out.push({ cn: `${s[0][0]}占比最高，为 ${s[0][1]}%。`, en: `${s[0][0]} accounted for the largest share, at ${s[0][1]}%.` });
      out.push({ cn: `${s[1][0]}位居第二，为 ${s[1][1]}%。`, en: `It was followed by ${s[1][0]}, which made up ${s[1][1]}%.` });
      out.push({ cn: `${s[s.length - 1][0]}所占比例最小，仅 ${s[s.length - 1][1]}%。`, en: `${s[s.length - 1][0]} accounted for the smallest share, a mere ${s[s.length - 1][1]}%.` });
      out.push({ cn: `最高项约为最低项的 ${(Number(s[0][1]) / Number(s[s.length - 1][1])).toFixed(1)} 倍。`, en: `The highest figure was roughly ${(Number(s[0][1]) / Number(s[s.length - 1][1])).toFixed(1)} times the lowest one.` });
      out.push({ cn: '两组数据之间形成了鲜明对比。', en: 'The two figures stand in sharp contrast to each other.' });
    }
    return out;
  },

  commentReference(c) {
    return `参考角度（任选三个、彼此不重复即可）：\n1. 原因：为什么会出现这一现象？可从经济、技术、观念三个层面切入。\n2. 影响：它带来了什么积极或消极后果？\n3. 应对：个人、企业或政府可以怎么做？\n\n示例中心论点："这一趋势在很大程度上可以归因于……"；"若任其发展，可能会进一步加剧……"；"要缓解这一问题，各方都需要……"\n\n注意：推测句要用 may / probably / it is conceivable that，不要写成图表已经证明的因果关系。`;
  },

  fullReference(c) {
    return `框架参考（约 150 词）：\n\n第 1 段（描述，约 60 词）：点明图表对象与时间，概括最主要特征，给出 1-2 个关键数据支撑。\n第 2 段（评论，约 70 词）：围绕 1-2 个角度展开，先给中心论点句，再用 2-3 句说明理由或举例。\n第 3 段（小结，约 20 词）：给出趋势判断或简要建议。\n\n可替换框架：\n① 现象—原因—评价\n② 总体描述—关键对比—原因推测—应对建议\n③ 静态排序—极值强调—影响分析\n\n常用表达：As is shown in the chart / account for the largest share / rank first / rise by ... percentage points / stand in sharp contrast to / This phenomenon can be attributed to ...`;
  },

  UPGRADE: [
    { plain: 'The number of people using smartphones increased very much from 2015 to 2024.', hint: '问题：increased very much 不搭配。请改用恰当的趋势动词与程度副词。', better: 'The number of smartphone users surged from ... in 2015 to ... in 2024.' },
    { plain: 'As we can see from the chart, the chart shows that more and more people like online shopping.', hint: '问题：重复啰嗦、like 表意弱。', better: 'As is shown in the chart, an increasing number of consumers are turning to online shopping.' },
    { plain: 'There are 34% of residents choose to stay at home at weekends.', hint: '问题：there be 与谓语动词冲突。', better: 'Some 34% of residents choose to stay at home at weekends. / Residents who prefer staying at home account for 34%.' },
    { plain: 'The reason of this phenomenon is because the economy develops fast.', hint: '问题：reason for；because 引导表语从句與 reason 重复；develops fast 表达平淡。', better: 'This phenomenon can be largely attributed to rapid economic growth.' },
    { plain: 'I think government should take measure to solve this problem.', hint: '问题：measure 单复数；表达过于空泛。', better: 'From my perspective, the authorities concerned should take effective measures to address this issue.' },
    { plain: 'Students is the biggest group, they spend 6.5 hours on phones.', hint: '问题：主谓不一致 + 逗号拼接。', better: 'Students constitute the largest group, spending as much as 6.5 hours a day on their phones.' },
    { plain: 'Comparing with 2015, the number is two times.', hint: '问题：compared with（被动含义）；倍数表达不完整。', better: 'Compared with the figure for 2015, the number has doubled.' },
    { plain: 'In conclusion, we must pay attention to this problem, or it will be more and more serious.', hint: '问题：表达口号化，缺少具体指向。', better: 'In conclusion, unless proper measures are taken, the situation is likely to deteriorate further.' }
  ],

  ASSEMBLE: [
    {
      stem: '把下面 6 个要点组织成一段连贯的图表描述段（约 60 词）：\nA. 其次是 31-45 岁群体，为 5.1 小时\nB. 18-30 岁群体以 6.5 小时位居第一\nC. 60 岁以上群体仅为 2.0 小时，不足前者的三分之一\nD. 该图展示了某市不同年龄段居民的日均手机使用时长\nE. 46-60 岁群体为 3.4 小时\nF. 可以看出，年龄越小，使用时长越长',
      reference: '参考顺序：D → B → A → E → C → F\n\nThe chart presents the average daily hours residents of different age groups in a certain city spent on their smartphones. Users aged 18 to 30 ranked first, at 6.5 hours, followed by the 31-45 group at 5.1 hours and the 46-60 group at 3.4 hours. By contrast, people over 60 spent a mere 2.0 hours, less than one third of the top figure. Overall, the younger the residents are, the longer they tend to stay on their phones.'
    },
    {
      stem: '把下面 5 个要点组织成一段连贯的评论段（约 70 词）：\nA. 因此，引导各年龄段形成健康的使用习惯十分必要\nB. 智能手机功能日益丰富，几乎覆盖了生活的方方面面\nC. 年轻人对社交与娱乐的需求更强，这解释了使用时长的差异\nD. 但过度使用可能挤占睡眠与运动时间，损害身心健康\nE. 这一现象可以从需求侧得到解释',
      reference: '参考顺序：E → B → C → D → A\n\nThis phenomenon can be explained from the demand side. Smartphones now offer an ever wider range of functions, covering almost every aspect of daily life. Younger users, who have a stronger need for social contact and entertainment, naturally spend more time on them. However, excessive use may crowd out time for sleep and exercise, doing harm to both physical and mental health. Therefore, it is necessary to guide people of all ages towards healthier habits.'
    }
  ],

  /* ---------------- 答题界面 ---------------- */
  renderQuiz(quiz) {
    const root = document.getElementById('viewRoot');
    const isEssayish = quiz.typeId && quiz.typeId.charAt(0) === 'e';
    root.innerHTML = `
      <div class="card card-pad">
        <div class="row row-wrap" style="justify-content:space-between">
          <div>
            <div style="font-size:17px;font-weight:700">${APP.ui.esc(quiz.title)}</div>
            <div class="hint mt8">${APP.ui.esc(quiz.intro || '')}</div>
          </div>
          <div class="row">
            <button class="btn btn-sm" onclick="APP.views.train.render()">← 返回训练列表</button>
            <button class="btn btn-sm btn-primary" onclick="APP.views.train.grade()">✅ 提交批改</button>
          </div>
        </div>
      </div>

      ${quiz.items.map(it => `
        <div class="q-block mt16" id="q_${it.id}">
          <div class="q-head"><div class="q-n">${it.id}</div><div class="tag tag-blue">${APP.ui.esc(quiz.typeName)}</div></div>
          <div class="q-en">${APP.ui.esc(it.stem)}</div>
          ${it.hint ? `<div class="hint mt8">💡 ${APP.ui.esc(it.hint)}</div>` : ''}
          <div class="mt12">
            <textarea class="textarea ${isEssayish ? 'en' : ''}" id="ans_${it.id}" placeholder="在这里作答…" oninput="APP.views.train.saveAns(${it.id}, this.value)"></textarea>
          </div>
          <div class="row mt8">
            <button class="btn btn-sm" onclick="APP.views.train.showRef(${it.id})">👀 看参考答案</button>
            <span class="hint">先做完再看，效果差很多。</span>
          </div>
        </div>`).join('')}

      <div class="card card-pad mt16">
        <div class="row row-wrap">
          <button class="btn btn-primary" onclick="APP.views.train.grade()">✅ 提交批改</button>
          <button class="btn" onclick="APP.views.train.revealAll()">👀 显示全部参考答案</button>
          <div class="spacer"></div>
          <button class="btn" onclick="APP.views.train.render()">返回列表</button>
        </div>
      </div>

      <div id="trainResult"></div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  saveAns(id, v) { this.state.answers[id] = v; },

  showRef(id) {
    const it = (this.state.quiz.items || []).find(x => x.id === id);
    if (!it) return;
    APP.ui.sheet('参考答案 · 第 ' + id + ' 题',
      `<div class="q-cn">${APP.ui.esc(it.reference)}</div>
       ${(it.points && it.points.length) ? `<div class="mt16" style="font-size:13.5px;font-weight:700">评分要点</div><div class="hint">${it.points.map(p => '• ' + APP.ui.esc(p)).join('<br>')}</div>` : ''}`);
  },

  revealAll() {
    (this.state.quiz.items || []).forEach(it => {
      const box = document.getElementById('q_' + it.id);
      if (box && !box.querySelector('.ref-box')) {
        const d = document.createElement('div');
        d.className = 'ref-box q-cn mt12';
        d.innerHTML = '<b>参考答案：</b>' + APP.ui.esc(it.reference);
        box.appendChild(d);
      }
    });
    APP.ui.toast('已显示参考答案');
  },

  /* ---------------- 批改 ---------------- */
  async grade() {
    const quiz = this.state.quiz;
    if (!quiz) return;
    const answers = quiz.items.map(it => ({ id: it.id, answer: (this.state.answers[it.id] || '').trim() }));
    if (!answers.some(a => a.answer)) { APP.ui.toast('至少作答一题再提交', 'err'); return; }
    if (!APP.ai.ready()) {
      APP.ui.sheet('复制批改请求', `<div class="hint mb8">未配置 API Key。把下面的内容复制到任意 AI 对话框，让它按 JSON 返回后，再用「粘贴批改结果」回填。</div>
        <textarea class="textarea tall" id="trReq">${APP.ui.esc(APP.prompts.trainGradeSystem + '\n\n' + APP.prompts.trainGradeUser(quiz.title, quiz.items, answers))}</textarea>
        <div class="row mt12"><div class="spacer"></div><button class="btn" onclick="APP.ui.copy(document.getElementById('trReq').value)">📋 复制</button></div>`);
      return;
    }
    APP.ui.loading(true, '正在批改…', '逐题比对评分要点');
    try {
      const data = await APP.ai.gradeTraining(quiz.title, quiz.items, answers);
      const box = document.getElementById('trainResult');
      box.innerHTML = this.resultHTML(data, quiz, answers);
      box.scrollIntoView({ behavior: 'smooth' });
      APP.store.addRecord({
        type: 'training', title: quiz.title, score: Math.round(data.avgScore || 0), full: 100,
        band: '训练得分',
        data: Object.assign({ result: data, quiz, answers, title: quiz.title, summary: data.summary }, {})
      });
      APP.store.addWeaknesses(data.newWeaknesses || [], data.avgScore);
      APP.store.addWrong(data.wrongItems || []);
      APP.refresh();
      APP.ui.toast('批改完成', 'ok');
    } catch (e) { APP.ui.toast(APP.ai.errMsg(e), 'err'); }
    finally { APP.ui.loading(false); }
  },

  resultHTML(data, quiz, answers) {
    const u = APP.ui;
    const score = Math.round(data.avgScore || 0);
    return `
      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>训练批改结果</div>
        <div class="score-hero ${u.bandClass(score / 100 * 15)}">
          <div class="score-big"><div class="num">${score}<span class="den">/100</span></div></div>
          <div class="score-meta">
            <div class="meta-box"><div class="k">题目数</div><div class="v">${(data.items || []).length} 题</div></div>
            <div class="meta-box"><div class="k">已作答</div><div class="v">${answers.filter(a => a.answer).length} 题</div></div>
            <div class="meta-box"><div class="k">进入错题本</div><div class="v">${(data.wrongItems || []).length} 条</div></div>
          </div>
        </div>
      </div>

      ${data.summary ? `<div class="card card-pad mt12" style="background:var(--panel-2)">
        <div class="sec-title" style="margin-bottom:6px"><span class="dot"></span>总体评价</div>
        <div style="font-size:14px;line-height:1.8">${u.md(data.summary)}</div>
      </div>` : ''}

      <div class="card card-pad mt12">
        <div class="sec-title"><span class="dot"></span>逐题批改</div>
        ${(data.items || []).map(it => {
      const qi = (quiz.items || []).find(x => x.id === it.id) || {};
      return `<div class="sent-item">
            <div class="sent-head">
              <div class="sent-idx">${it.id}</div>
              <div class="sent-src">${u.esc((qi.stem || '').slice(0, 120))}${((qi.stem || '').length > 120) ? '…' : ''}</div>
              <div class="sent-score">${it.score} 分</div>
            </div>
            <div class="sent-body">
              <div class="sent-line"><div class="k">✍️ 我的作答</div><div class="v">${u.esc(it.student || '（未作答）')}</div></div>
              <div class="sent-line"><div class="k">✅ 参考答案</div><div class="v good">${u.esc(it.reference || qi.reference || '')}</div></div>
              ${(it.problems || []).length ? `<div class="sent-line"><div class="k">🔍 问题与修改</div>
                <div class="kp-list">${it.problems.map(p => `<div class="kp ${p.level === 'must' ? 'miss' : 'partial'}">
                  <span class="kp-i">${p.level === 'must' ? '必改' : '优化'}</span>
                  <div class="kp-t"><div>${u.esc(p.text)}</div>
                    <div style="color:var(--green);margin-top:2px">→ ${u.esc(p.fix)}</div>
                    <div class="kp-n">${u.esc(p.reason)}</div></div>
                </div>`).join('')}</div></div>` : ''}
              ${it.comment ? `<div class="sent-line"><div class="k">🗣️ 点评</div><div class="v">${u.esc(it.comment)}</div></div>` : ''}
              <div class="bar ${u.barClass(it.score, 100)}"><i style="width:${it.score}%"></i></div>
            </div>
          </div>`;
    }).join('')}
      </div>

      ${(data.suggestions && data.suggestions.length) ? `<div class="card card-pad mt12">
        <div class="sec-title"><span class="dot"></span>下一步训练建议</div>
        ${data.suggestions.map((s, i) => `<div class="weak-item"><div class="wi-n">${i + 1}</div><div class="wi-d" style="margin:0">${u.esc(s)}</div></div>`).join('')}
        <button class="btn btn-green btn-block mt8" onclick="APP.views.train.render()">🎯 再练一组</button>
      </div>` : ''}`;
  },

  showResult(payload) {
    if (!payload || !payload.result) return;
    APP.go('train');
    setTimeout(() => {
      let box = document.getElementById('trainResult');
      if (!box && payload.quiz) {
        this.state.quiz = payload.quiz;
        this.state.answers = {};
        (payload.answers || []).forEach(a => { this.state.answers[a.id] = a.answer; });
        this.renderQuiz(payload.quiz);
        Object.keys(this.state.answers).forEach(k => {
          const el = document.getElementById('ans_' + k);
          if (el) el.value = this.state.answers[k] || '';
        });
        box = document.getElementById('trainResult');
      }
      if (box) { box.innerHTML = this.resultHTML(payload.result, payload.quiz, payload.answers || []); box.scrollIntoView(); }
      else APP.ui.toast('该训练记录缺少题目数据，无法回看', 'err');
    }, 60);
  }
};

</script>
