<script>
/* ============================================================
 *  views/review.js —— 错题本与薄弱点
 * ============================================================ */
window.APP = window.APP || {}; APP.views = APP.views || {};

APP.views.review = {
  title: '错题本', sub: '把每次扣分都变成下次的分', icon: '📒',

  state: { filter: 'all', showMastered: false },

  render(root) {
    const all = APP.store.getWrong();
    const weak = APP.store.getWeaknesses();
    const tags = Array.from(new Set(all.map(w => w.tag)));
    const list = all.filter(w => {
      if (!this.state.showMastered && w.mastered) return false;
      if (this.state.filter !== 'all' && w.tag !== this.state.filter) return false;
      return true;
    });

    root.innerHTML = `
      <div class="grid g3 keep2">
        <div class="stat-box"><div class="s-k">错题总数</div><div class="s-v" style="color:var(--primary)">${all.length}</div><div class="s-sub">待复习 ${all.filter(w => !w.mastered).length} 条</div></div>
        <div class="stat-box"><div class="s-k">薄弱点标签</div><div class="s-v" style="color:var(--orange)">${weak.length}</div><div class="s-sub">按出现次数排序</div></div>
        <div class="stat-box"><div class="s-k">已掌握</div><div class="s-v" style="color:var(--green)">${all.filter(w => w.mastered).length}</div><div class="s-sub">标记为已掌握</div></div>
      </div>

      ${weak.length ? `<div class="card card-pad mt16">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <div class="sec-title" style="margin:0"><span class="dot"></span>薄弱点分布</div>
          <button class="btn btn-sm" onclick="APP.views.review.clearWeak()">清空统计</button>
        </div>
        <div class="row row-wrap">
          ${weak.map(w => `<button class="pick ${this.state.filter === w.tag ? 'active' : ''}" style="width:auto" onclick="APP.views.review.setFilter('${APP.ui.esc(w.tag)}')">
            <div class="pt">${APP.ui.esc(w.tag)}</div><div class="pd">出现 ${w.count} 次</div>
          </button>`).join('')}
        </div>
      </div>` : ''}

      <div class="card card-pad mt16">
        <div class="row row-wrap" style="justify-content:space-between;margin-bottom:12px">
          <div class="sec-title" style="margin:0"><span class="dot"></span>错题清单 ${this.state.filter !== 'all' ? '· ' + APP.ui.esc(this.state.filter) : ''}</div>
          <div class="row row-wrap">
            <button class="btn btn-sm ${this.state.filter === 'all' ? 'btn-primary' : ''}" onclick="APP.views.review.setFilter('all')">全部</button>
            <button class="btn btn-sm ${this.state.showMastered ? 'btn-primary' : ''}" onclick="APP.views.review.toggleShow()">${this.state.showMastered ? '隐藏已掌握' : '显示已掌握'}</button>
            <button class="btn btn-sm" onclick="APP.views.review.exportWrong()">📤 导出</button>
          </div>
        </div>

        ${list.length ? list.map(w => `
          <div class="weak-item" style="align-items:flex-start">
            <div class="wi-n" style="background:${w.mastered ? 'var(--green-l)' : 'var(--orange-l)'};color:${w.mastered ? 'var(--green)' : 'var(--orange)'}">${w.mastered ? '✓' : '!'}</div>
            <div style="flex:1;min-width:0">
              <div class="row row-wrap">
                <span class="wi-t" style="${w.mastered ? 'text-decoration:line-through;color:var(--text-3)' : ''}">${APP.ui.esc(w.title)}</span>
                <span class="tag tag-blue">${APP.ui.esc(w.tag)}</span>
              </div>
              <div class="wi-d">${APP.ui.esc(w.content)}</div>
              ${w.source ? `<div class="hint mt8">来源：${APP.ui.esc(w.source)} · ${APP.ui.timeAgo(w.createdAt)}</div>` : ''}
              <div class="row mt8">
                <button class="btn btn-sm" onclick="APP.views.review.toggle('${w.id}')">${w.mastered ? '↩︎ 重新标记' : '✓ 已掌握'}</button>
                <button class="btn btn-sm btn-outline" onclick="APP.views.train.startByWeak('${APP.ui.esc(w.tag)}')">🎯 针对性训练</button>
                <div class="spacer"></div>
                <button class="btn btn-sm" onclick="APP.views.review.del('${w.id}')">删除</button>
              </div>
            </div>
          </div>`).join('') : APP.ui.empty('📒', '暂无错题。完成批改后，系统会把"高优先级薄弱点"自动收进来。')}
      </div>`;
  },

  setFilter(t) { this.state.filter = t; this.render(); },
  toggleShow() { this.state.showMastered = !this.state.showMastered; this.render(); },
  toggle(id) { APP.store.toggleMastered(id); this.render(); },
  del(id) { APP.store.delWrong(id); this.render(); APP.ui.toast('已删除'); },
  clearWeak() { if (confirm('确定清空薄弱点统计吗？错题本内容会保留。')) { APP.store.clearWeaknesses(); this.render(); } },
  exportWrong() {
    const all = APP.store.getWrong();
    const text = all.map(w => '【' + w.tag + '】' + w.title + '\n' + w.content + '\n（来源：' + (w.source || '—') + '）\n').join('\n———————\n');
    APP.ui.sheet('导出错题本', `<textarea class="textarea tall" id="expBox">${APP.ui.esc(text)}</textarea>
      <div class="row mt12"><div class="spacer"></div><button class="btn btn-primary" onclick="APP.ui.copy(document.getElementById('expBox').value)">📋 复制全文</button></div>`);
  }
};

</script>
<!-- ===== assets/js/views/settings.js ===== -->
<script>
/* ============================================================
 *  views/settings.js —— 设置与数据管理
 * ============================================================ */
window.APP = window.APP || {}; APP.views = APP.views || {};

APP.views.settings = {
  title: '设置', sub: '批改引擎、数据与使用说明', icon: '⚙️',

  render(root) {
    // 允许无参重渲染（保存/选模型后刷新自身），沿用最后一次的容器
    if (root) this._root = root; else root = this._root;
    if (!root) return;

    const s = APP.store.getSettings();
    const P = APP.ai.PROVIDERS;
    const isAgg = !!(P[s.provider] && P[s.provider].agg);

    const isFile = location.protocol.indexOf('file') === 0;

    root.innerHTML = `
      ${isFile ? `<div class="callout" style="margin-bottom:12px">
        <div class="co-title">📄 当前是「本地文件」模式</div>
        <div class="hint mt8">你是双击 HTML 文件打开的，界面和题库都能正常使用，但浏览器默认会拦截它向大模型接口发出的请求（CORS）。
        建议二选一：<b>① 改用云端链接打开</b>，可直接联网批改；<b>② 继续用本地文件</b>，改走「复制批改请求」，把请求粘到任意 AI 对话框，再把结果贴回来。</div>
      </div>` : ''}
      <div class="card card-pad">
        <div class="sec-title"><span class="dot"></span>批改引擎（大模型接口）</div>
        <div class="hint mb8">应用本身不提供模型服务，需填入你自己的 API Key。Key 只保存在本机浏览器（localStorage），不会上传到任何第三方。</div>

        <div class="field">
          <div class="label">服务商预设</div>
          <select class="select" id="stProvider">
            ${Object.keys(P).map(k => `<option value="${k}"${s.provider === k ? ' selected' : ''}>${P[k].name}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <div class="label">接口地址 Base URL</div>
          <input class="input" id="stBase" value="${APP.ui.esc(s.baseUrl)}" placeholder="https://api.deepseek.com/v1">
        </div>

        <div class="field">
          <div class="label">API Key <span class="req">*</span></div>
          <input class="input" id="stKey" type="password" value="${APP.ui.esc(s.apiKey)}" placeholder="sk-...">
        </div>

        ${isAgg ? `<div class="callout mt8">
          <div class="co-title">🧩 检测到你使用的是「聚合站」</div>
          <div class="hint mt8">聚合站一个 Key 对应几十到几百个模型，模型名各不相同，手写很容易填错。直接点下面两个按钮，从接口里把真实可用的模型拉出来选。</div>
        </div>` : ''}

        <div class="field mt12">
          <div class="label">批改模型 <span class="req">*</span>（负责阅卷打分）</div>
          <div class="row">
            <input class="input" id="stModel" value="${APP.ui.esc(s.model)}" placeholder="deepseek-chat" style="flex:1;min-width:0">
            <button class="btn btn-sm btn-primary" onclick="APP.views.settings.pickModel('model')">🔄 选择模型</button>
            ${isAgg ? `<button class="btn btn-sm" onclick="APP.views.settings.howToPick()">❓ 怎么选</button>` : ''}
          </div>
          <div class="hint mt8">${isAgg ? '批改要求严格按规则输出，推荐选 <b>指令跟随强、逻辑好</b> 的模型（各家旗舰/大尺寸模型），不要选小尺寸或纯推理模型。' : '留空则无法批改。'}</div>
        </div>

        <div class="grid g2 mt12">
          <div class="field">
            <div class="label">视觉模型（识别手写图片，可选）</div>
            <div class="row">
              <input class="input" id="stVision" value="${APP.ui.esc(s.visionModel)}" placeholder="留空则用主模型" style="flex:1;min-width:0">
              <button class="btn btn-sm" onclick="APP.views.settings.pickModel('vision')">🔄 选</button>
            </div>
          </div>
          <div class="field">
            <div class="label">视觉模型接口地址（可选）</div>
            <input class="input" id="stVisionUrl" value="${APP.ui.esc(s.visionBaseUrl)}" placeholder="留空则用上面的地址">
          </div>
        </div>
        <div class="hint">${isAgg
          ? '聚合站里名字带 <b>vision / vl / 4o / claude-3 / gemini</b> 的通常能读图。点「选」会只筛出该站支持图片输入的模型。'
          : 'DeepSeek 官方模型目前不支持图片识别。若需要识别手写稿，可选用支持视觉的模型（如 glm-4v、qwen-vl、gpt-4o 系列等），只在这一栏填写即可，批改仍用主模型。'}</div>

        <div class="field mt12">
          <div class="label">温度 Temperature：${s.temperature}</div>
          <input type="range" min="0" max="1" step="0.1" value="${s.temperature}" id="stTemp" style="width:100%">
          <div class="hint">批改场景建议 0-0.3（更稳定、更严格）；出题场景可适当调高。</div>
        </div>

        <div class="row row-wrap mt12">
          <button class="btn btn-primary" onclick="APP.views.settings.save()">💾 保存设置</button>
          <button class="btn btn-green" onclick="APP.views.settings.test()">🔌 测试连接</button>
          <button class="btn" onclick="APP.views.settings.pickModel('model')">🔄 获取模型列表</button>
          <button class="btn" onclick="APP.views.settings.pasteFromAI()">🤖 没有 Key？看这里</button>
        </div>
      </div>

      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>常见问题</div>
        <div class="hint" style="line-height:1.9">
          <b>1. 提示「网络请求失败」怎么办？</b><br>
          多数是浏览器跨域（CORS）限制。解决办法：① 换用支持浏览器直连的服务商；② 或点击各页面的「复制批改请求」，把内容粘到任意 AI 对话框里批改，再用「粘贴批改结果」回填，功能完全一致。<br><br>
          <b>2. 手机和电脑数据能同步吗？</b><br>
          目前数据存于各自浏览器本地，互不同步。可在下方「导出数据」生成备份文件，在另一台设备「导入数据」。<br><br>
          <b>3. 批改分数准不准？</b><br>
          提示词已完整嵌入考研英语二官方评分标准（翻译逐句采分、错别字累计扣分、一题多译按错译评分；作文四档评分、静态/动态区分、百分比与百分点区分），并要求模型输出结构化 JSON 后由本页面渲染，比直接对话更稳定。但仍是练习参考，不等于真实阅卷。<br><br>
          <b>4. 手机上怎么装到桌面？</b><br>
          用手机浏览器打开后，选择「添加到主屏幕」，即可像 App 一样使用。<br><br>
          <b>5. 用的是聚合站（一个 Key 很多模型），模型名怎么填？</b><br>
          不要手填。服务商预设里选带「聚合站」的那一项，填好地址和 Key，点<b>「🔄 选择模型」</b>直接从接口把你 Key 下可用的模型拉出来点选。
          若站点禁止浏览器直连（报 CORS / 网络失败），按弹窗提示在浏览器里打开 <code>/models</code> 地址复制模型名，或直接在「手填 ID」里填写。<br><br>
          <b>6. 明明有余额，却提示 404 / 模型不存在？</b><br>
          九成是模型名不对。聚合站的模型名常常带前缀（如 <code>openai/gpt-4o</code>）或后缀（如 <code>-20240926</code>、<code>:free</code>），
          必须和站方给的完全一致。仍用「🔄 选择模型」拉取，别凭印象写。
        </div>
      </div>

      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>数据管理</div>
        <div class="row row-wrap">
          <button class="btn" onclick="APP.views.settings.exportData()">📤 导出全部数据</button>
          <button class="btn" onclick="APP.views.settings.importData()">📥 导入数据</button>
          <button class="btn" onclick="APP.views.settings.clearRecords()">🗑️ 清空批改记录</button>
          <button class="btn" onclick="APP.views.settings.resetAll()">⚠️ 恢复出厂设置</button>
        </div>
        <div class="hint mt8">记录 ${APP.store.getRecords().length} 条 · 错题 ${APP.store.getWrong().length} 条 · 打卡 ${APP.store.get().checkins.length} 天</div>
      </div>

      <div class="card card-pad mt16">
        <div class="sec-title"><span class="dot"></span>关于</div>
        <div class="hint">
          考研英语二 · 翻译与作文 AI 批改系统 v1.0<br>
          评分标准内置：翻译 15 分四档 + 逐句采分规则；大作文 15 分五档评分参考。<br>
          所有练习数据仅保存在你自己的设备上。
        </div>
      </div>`;

    document.getElementById('stProvider').onchange = e => {
      const p = APP.ai.PROVIDERS[e.target.value];
      if (p && p.baseUrl) document.getElementById('stBase').value = p.baseUrl;
      // 聚合站没有唯一默认模型，绝不写入空的模型名，避免把已配好的模型清掉
      if (p && p.model) document.getElementById('stModel').value = p.model;
      this.save(true);
      this.render();
      if (p && p.agg) APP.ui.toast('已切到聚合站，点「🔄 选择模型」拉取真实模型名', 'ok');
    };
    document.getElementById('stTemp').oninput = e => {
      e.target.previousElementSibling ? null : null;
      const lbl = document.querySelector('label[for]');
      e.target.parentElement.querySelector('.label').textContent = '温度 Temperature：' + e.target.value;
    };
  },

  save(quiet) {
    const g = id => document.getElementById(id).value.trim();
    APP.store.setSettings({
      provider: g('stProvider'), baseUrl: g('stBase'), model: g('stModel'),
      apiKey: g('stKey'), visionModel: g('stVision'), visionBaseUrl: g('stVisionUrl'),
      temperature: parseFloat(document.getElementById('stTemp').value)
    });
    APP.refresh();
    if (!quiet) APP.ui.toast('设置已保存', 'ok');
  },

  /* ============================================================
   *  模型选择器（聚合站 / 中转站专用）
   * ============================================================ */
  pickModel(target) {
    const self = this;
    const g = id => (document.getElementById(id) || {}).value || '';
    const key = g('stKey').trim();
    const mainBase = g('stBase').trim();
    const base = target === 'vision' ? (g('stVisionUrl').trim() || mainBase) : mainBase;

    if (!key) {
      APP.ui.toast('请先填写 API Key，再获取模型列表', 'err');
      const el = document.getElementById('stKey'); if (el) el.focus();
      return;
    }
    if (!base) {
      APP.ui.toast('请先填写接口地址 Base URL', 'err');
      const el = document.getElementById('stBase'); if (el) el.focus();
      return;
    }

    APP.ui.loading(true, '正在获取可用模型…', '读取该 Key 授权的模型列表');
    APP.ai.listModels({ apiKey: key, baseUrl: base })
      .then(r => {
        APP.ui.loading(false);
        self.openPicker(target, r.models, r.url, base, null);
      })
      .catch(e => {
        APP.ui.loading(false);
        self.openPicker(target, [], APP.ai.modelsCandidates(base)[0] || '', base, e);
      });
  },

  openPicker(target, models, url, base, err) {
    const self = this;
    const isVision = target === 'vision';
    const cur = ((document.getElementById(isVision ? 'stVision' : 'stModel') || {}).value || '').trim();
    const vis = models.filter(m => m.vision).length;

    /* ---------- 自动拉取失败：兜底为手动粘贴 / 手填 ---------- */
    if (err) {
      const msg = APP.ai.errMsg(err);
      APP.ui.sheet('获取模型列表失败', `
        <div class="hint" style="color:var(--red);line-height:1.8">${APP.ui.esc(msg)}</div>
        <div class="hint mt12" style="line-height:1.9">
          <b>聚合站最常见的两个原因：</b><br>
          ① <b>浏览器跨域（CORS）被拦截</b>——聚合站大多没开放浏览器直连。<br>
          ② <b>接口地址填错</b>，站方通常给的是 <code>https://xxx/v1</code> 这种形式。
        </div>
        ${url ? `<div class="callout mt12">
          <div class="co-title">方法：自己在浏览器打开模型列表</div>
          <div class="hint mt8">复制下面的地址在新标签页打开（会显示一串 JSON），找到想要的模型名：</div>
          <textarea class="textarea mt8" style="min-height:44px" id="mdUrlText" readonly>${APP.ui.esc(url)}</textarea>
          <div class="row mt8"><div class="spacer"></div><button class="btn btn-sm" onclick="APP.ui.copy(document.getElementById('mdUrlText').value)">📋 复制地址</button></div>
        </div>` : ''}
        <div class="field mt12">
          <div class="label">粘贴进来，或直接手填</div>
          <textarea class="textarea" id="mdPaste" style="min-height:110px" placeholder="把浏览器里看到的 JSON 粘到这里；也可以一行一个模型 ID，例如：&#10;gpt-4o&#10;claude-3-5-sonnet&#10;qwen-plus"></textarea>
          <div class="hint mt8">也支持直接粘贴聚合站后台「模型列表」页面上复制出来的文字。</div>
        </div>
        <div class="row mt12">
          <input class="input" id="mdManualInput" placeholder="或直接手填模型 ID" style="flex:1;min-width:0" value="${APP.ui.esc(cur)}">
          <button class="btn btn-primary" id="mdManualOk">填入</button>
        </div>`, body => {
        const parse = () => {
          const t = document.getElementById('mdPaste').value;
          if (!t.trim()) { APP.ui.toast('请先粘贴内容', 'err'); return; }
          try {
            const ms = APP.ai.parseModelList(t);
            if (!ms.length) throw new Error('EMPTY');
            self.openPicker(target, ms, '', base, null);
          } catch (e2) {
            APP.ui.toast('没解析出模型名，请直接在下方手填', 'err');
          }
        };
        const manual = () => {
          const v = (document.getElementById('mdManualInput').value || '').trim();
          if (!v) { APP.ui.toast('请输入模型 ID', 'err'); return; }
          self.applyModel(target, v);
        };
        body.querySelector('#mdManualOk').onclick = manual;
        const p = body.querySelector('#mdPaste');
        if (p) p.oninput = () => { if (/[\n,;]/.test(p.value)) { /* 保留手动触发 */ } };
        // 粘贴后自动尝试解析
        if (p) p.onblur = () => { if (p.value.trim()) parse(); };
      });
      return;
    }

    /* ---------- 成功：渲染可选列表 ---------- */
    APP.ui.sheet(
      `${isVision ? '选择视觉模型' : '选择批改模型'}（共 ${models.length} 个${isVision ? '' : '，其中疑似支持图片 ' + vis + ' 个'}）`,
      `
      <div class="row">
        <input class="input" id="mdSearch" placeholder="搜索，如 gpt / claude / qwen / vision" style="flex:1;min-width:0">
      </div>
      <div class="row row-wrap mt8">
        <div class="md-seg" id="mdSeg">
          <button class="on" data-vis="0">全部 ${models.length}</button>
          <button data-vis="1">👁 仅视觉 ${vis}</button>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-sm" id="mdManualBtn">✍️ 手填 ID</button>
      </div>
      <div class="row mt8" id="mdManualBox" style="display:none">
        <input class="input" id="mdManualInput" placeholder="手填模型 ID，如 gpt-4o" style="flex:1;min-width:0" value="${APP.ui.esc(cur)}">
        <button class="btn btn-primary" id="mdManualOk">填入</button>
      </div>
      <div class="md-list mt12" id="mdList"></div>
      <div class="hint mt12">${isVision
        ? '👁 标记是根据模型名推断的「疑似支持图片」，个别可能不准，以实测为准。'
        : '批改需要模型严格按格式输出 JSON，建议选各家<b>旗舰 / 大尺寸</b>模型；纯推理模型（如 r1 / o1 类）容易在格式上出错。'}</div>`,
      body => {
        let onlyVis = false, kw = '';
        const listEl = body.querySelector('#mdList');

        function render() {
          const k = kw.toLowerCase();
          let l = models.filter(m => !k || m.id.toLowerCase().indexOf(k) >= 0 || (m.name || '').toLowerCase().indexOf(k) >= 0);
          if (onlyVis) l = l.filter(m => m.vision);
          const shown = l.slice(0, 200);
          if (!shown.length) {
            listEl.innerHTML = APP.ui.empty('🔍', '没有匹配的模型，换个关键词试试');
            return;
          }
          listEl.innerHTML = shown.map(m => {
            const ctx = m.ctx ? `<span class="tag">${Math.round(m.ctx / 1024) >= 1 ? Math.round(m.ctx / 1024) + 'k' : m.ctx}</span>` : '';
            const v = m.vision ? '<span class="tag tag-green">👁 视觉</span>' : '';
            return `<div class="md-item${m.id === cur ? ' on' : ''}" data-id="${APP.ui.esc(m.id)}">
              <div class="mi-main">
                <div class="mi-id">${APP.ui.esc(m.id)}</div>
                ${m.name && m.name !== m.id ? `<div class="mi-name">${APP.ui.esc(m.name)}</div>` : ''}
              </div>
              <div class="mi-tags">${v}${ctx}</div>
            </div>`;
          }).join('') + (l.length > 200
            ? `<div class="hint mt8" style="text-align:center">仅显示前 200 个（共 ${l.length} 个），输入关键词缩小范围</div>`
            : '');
          listEl.querySelectorAll('.md-item').forEach(it => {
            it.onclick = () => self.applyModel(target, it.dataset.id);
          });
        }

        const seg = body.querySelector('#mdSeg');
        seg.querySelectorAll('button').forEach(b => {
          b.onclick = () => {
            onlyVis = b.dataset.vis === '1';
            seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
            render();
          };
        });
        body.querySelector('#mdSearch').oninput = e => { kw = e.target.value.trim(); render(); };

        const mbtn = body.querySelector('#mdManualBtn');
        const mbox = body.querySelector('#mdManualBox');
        mbtn.onclick = () => {
          const open = mbox.style.display !== 'none';
          mbox.style.display = open ? 'none' : 'flex';
          if (!open) { mbtn.textContent = '✍️ 收起手填'; body.querySelector('#mdManualInput').focus(); }
          else mbtn.textContent = '✍️ 手填 ID';
        };
        body.querySelector('#mdManualOk').onclick = () => {
          const v = (body.querySelector('#mdManualInput').value || '').trim();
          if (!v) { APP.ui.toast('请输入模型 ID', 'err'); return; }
          self.applyModel(target, v);
        };

        render();
      });
  },

  applyModel(target, id) {
    const inp = document.getElementById(target === 'vision' ? 'stVision' : 'stModel');
    if (inp) inp.value = id;
    APP.ui.closeSheet();
    this.save(true);
    this.render();
    APP.ui.toast((target === 'vision' ? '视觉模型已选：' : '批改模型已选：') + id, 'ok');
  },

  howToPick() {
    APP.ui.sheet('聚合站怎么挑模型', `
      <div class="hint" style="line-height:1.9">
        <b>1. 批改模型：要「听话」，不要「聪明」</b><br>
        本系统要求模型严格按 JSON 输出逐句采分、扣分原因、修改后全文。
        所以优先选<b>指令跟随强的旗舰/大尺寸模型</b>（如各家 Pro / Plus / 4o / Sonnet 级），
        其次才是便宜的中端模型。<b>不建议</b>选 o1 / r1 这类纯推理模型——它们常在格式上翻车，也不建议选 7B 以下小模型。<br><br>
        <b>2. 视觉模型：只看「能不能读图」</b><br>
        名字里带 <code>vision</code>、<code>-vl</code>、<code>4o</code>、<code>claude-3</code>、<code>gemini</code> 的一般可以。
        点「👁 仅视觉」按钮会自动筛出来。这一栏只负责把手写稿转写成文字，用便宜的即可。<br><br>
        <b>3. 一个 Key 两个模型，最省钱的组合</b><br>
        日常批改用中端模型（如 4o-mini / qwen-plus / glm-4-flash），
        视觉模型单独选一个能读图的。<b>批改仍会走主模型</b>，视觉模型只在传图片时才被调用。<br><br>
        <b>4. 拿不准就实测</b><br>
        选完点「🔌 测试连接」，能正常回复说明这个模型名在你的 Key 里确实可用。
      </div>`);
  },

  async test() {
    this.save(true);
    const s = APP.store.getSettings();
    if (!s.apiKey) { APP.ui.toast('请先填写 API Key', 'err'); return; }
    if (!s.baseUrl) { APP.ui.toast('请先填写接口地址 Base URL', 'err'); return; }
    if (!s.model) { APP.ui.toast('还没选批改模型，点「🔄 选择模型」', 'err'); return; }
    /* 先探测跨域：浏览器会在真正的 POST 前发一次 OPTIONS 预检，预检不过就根本发不出去 */
    APP.ui.loading(true, '正在探测接口能否直连…', '检查跨域策略 CORS');
    let probe;
    try { probe = await APP.ai.probeCors(s.baseUrl); }
    catch (e) { probe = { ok: true }; }   // 探测本身异常时不拦路，交给真实请求去报错
    APP.ui.loading(false);
    if (probe && probe.ok === false) { this.showCorsHelp(probe, s.baseUrl); return; }

    APP.ui.loading(true, '正在测试连接…', '发送一条最小请求');
    try {
      const r = await APP.ai.chat([{ role: 'user', content: '只回复两个字：正常' }], { json: false });
      APP.ui.loading(false);
      APP.ui.sheet('连接成功 ✅', `
        <div class="callout">
          <div class="co-title">🎉 可以联网批改</div>
          <div class="hint mt8">该接口允许浏览器直连，后续翻译 / 作文批改都会自动走网络，不用手动复制粘贴。</div>
        </div>
        <div class="hint mt12">模型返回：</div>
        <div class="q-cn mt8">${APP.ui.esc(String(r).slice(0, 200))}</div>`);
    } catch (e) {
      APP.ui.loading(false);
      APP.ui.sheet('连接失败', `<div class="hint" style="color:var(--red)">${APP.ui.esc(APP.ai.errMsg(e))}</div>
        <div class="hint mt12">跨域检查是通过的，所以问题多半在账号侧：Key 是否有效、模型名是否正确、余额是否充足。可用「🔄 选择模型」确认模型名。</div>
        <div class="hint mt12">若反复失败，可直接使用「复制批改请求」模式：把生成的提示词粘到任意 AI 对话框中批改，再把结果用「粘贴批改结果」回填到本页面，功能完全一致。</div>`);
    }
  },

  /** 接口不允许浏览器直连时的说明与出路 */
  showCorsHelp(probe, baseUrl) {
    const reasonText = {
      file: '你是<b>双击本地文件</b>打开的。这种情况下页面来源是 <code>null</code>，浏览器不允许它向任何外部接口发请求。',
      noheader: '该接口对预检请求没有返回 <code>Access-Control-Allow-Origin</code>，浏览器因此拦下了请求。',
      blocked: '请求在发出前就被浏览器拦截（跨域策略不允许）。',
      nocfg: '接口地址为空。'
    }[probe.reason] || '无法直连该接口。';

    APP.ui.sheet('无法联网批改：该接口不允许浏览器直连', `
      <div class="hint" style="line-height:1.9">
        <b>原因</b><br>${reasonText}<br><br>
        <b>这不是本应用的问题，也不影响其他功能。</b>界面、题库、专项训练、成绩统计都能正常用，
        只有「填 Key 后自动批改」这一条路走不通。<br><br>
        <b>三条出路（任选其一）</b><br>
        <b>① 换一个允许直连的接口</b><br>
        实测目前<b>支持</b>浏览器直连的：DeepSeek 官方、硅基流动、OpenRouter、阿里云通义；
        <b>不支持</b>的：智谱 GLM、Moonshot。聚合站（中转站）各家不一，改完地址点「重新检测」即可判定。<br><br>
        <b>② 把页面放到真实的 https 域名下</b><br>
        托管到 GitHub Pages / Gitee Pages / Vercel / Cloudflare Pages 等，页面来源就变成正常的 <code>https://…</code>，
        可以正常参与跨域校验（本地文件模式则永远不行）。<br><br>
        <b>③ 用「复制批改请求」模式</b><br>
        不依赖任何网络权限：复制提示词 → 粘到任意 AI 对话框 → 把结果贴回来，评分、薄弱点、错题本照样自动入库。
      </div>
      <div class="row mt12">
        <input class="input" id="probeUrl" readonly value="${APP.ui.esc(baseUrl)}" style="flex:1;min-width:0">
        <button class="btn btn-sm" onclick="APP.ui.copy(document.getElementById('probeUrl').value)">📋</button>
        <button class="btn btn-sm btn-primary" onclick="APP.views.settings.test()">重新检测</button>
      </div>`);
  },

  pasteFromAI() {
    APP.ui.sheet('没有 API Key 也能用', `
      <div class="hint" style="line-height:1.9">
        本应用内置了完整的<b>考研英语二阅卷提示词</b>。即使不配置 Key，也可以这样用：<br><br>
        <b>方式一（推荐）</b><br>
        1. 在翻译/作文页面填好内容，点「📋 复制批改请求」<br>
        2. 粘贴到任意 AI 对话框，让它返回批改结果<br>
        3. 回到本页面点「📥 粘贴批改结果」，系统会解析并保存分数、薄弱点和错题<br><br>
        <b>方式二</b><br>
        直接用「专项训练 → 内置题」练习，题库已包含 18 个高频结构句、8 套图表题、8 条句式升级与 2 组段落拼装，可离线作答并对照参考答案。<br><br>
        <b>方式三</b><br>
        配置一个便宜的国产模型 Key（一般几元可用很久），即可全自动批改。
      </div>`);
  },

  exportData() {
    APP.ui.sheet('导出数据', `<div class="hint mb8">复制下面全部内容，保存到文本文件即可备份。</div>
      <textarea class="textarea tall" id="expData">${APP.ui.esc(APP.store.exportJSON())}</textarea>
      <div class="row mt12"><div class="spacer"></div><button class="btn btn-primary" onclick="APP.ui.copy(document.getElementById('expData').value)">📋 复制</button></div>`);
  },

  importData() {
    APP.ui.sheet('导入数据', `<div class="hint mb8">粘贴此前导出的 JSON 内容（会覆盖现有数据）。</div>
      <textarea class="textarea tall" id="impData" placeholder='{"settings":{...},"records":[...]}'></textarea>
      <div class="row mt12"><div class="spacer"></div>
        <button class="btn" onclick="APP.ui.closeSheet()">取消</button>
        <button class="btn btn-primary" onclick="APP.views.settings.doImport()">导入</button>
      </div>`);
  },
  doImport() {
    const t = document.getElementById('impData').value;
    if (APP.store.importJSON(t)) { APP.ui.closeSheet(); APP.refresh(); APP.ui.toast('导入成功', 'ok'); this.render(); }
    else APP.ui.toast('导入失败：JSON 格式不正确', 'err');
  },

  clearRecords() {
    if (confirm('确定清空全部批改记录吗？错题本与薄弱点会保留。')) {
      APP.store.clearRecords(); APP.refresh(); this.render(); APP.ui.toast('已清空');
    }
  },
  resetAll() {
    if (confirm('将清空全部设置、记录、错题与打卡数据，确定继续吗？')) {
      APP.store.reset(); APP.refresh(); this.render(); APP.ui.toast('已恢复出厂设置');
    }
  }
};

</script>
<!-- ===== assets/js/app.js ===== -->
<script>
/* ============================================================
 *  app.js —— 路由与全局初始化
 * ============================================================ */
window.APP = window.APP || {};

(function () {
  const NAV = [
    { id: 'dashboard', name: '仪表盘', icon: '🏠' },
    { id: 'translate', name: '翻译批改', icon: '📝' },
    { id: 'essay', name: '作文批改', icon: '📊' },
    { id: 'train', name: '专项训练', icon: '🎯' },
    { id: 'review', name: '错题本', icon: '📒' },
    { id: 'settings', name: '设置', icon: '⚙️' }
  ];
  const MOBILE = ['dashboard', 'translate', 'essay', 'train', 'review'];

  let current = 'dashboard';

  function renderNav() {
    document.getElementById('navDesk').innerHTML = NAV.map(n =>
      `<button class="nav-item${n.id === current ? ' active' : ''}" onclick="APP.go('${n.id}')">
        <span class="ico">${n.icon}</span><span>${n.name}</span>
      </button>`).join('');
    document.getElementById('navMobile').innerHTML = MOBILE
      .map(id => NAV.find(n => n.id === id))
      .filter(Boolean)
      .map(n =>
        `<button class="${n.id === current ? 'active' : ''}" onclick="APP.go('${n.id}')">
          <span class="ico">${n.icon}</span><span>${n.name.replace('批改', '').replace('仪表盘', '首页')}</span>
        </button>`).join('');
  }

  function go(id) {
    const v = APP.views[id];
    if (!v) return;
    current = id;
    APP.store.update(s => { s.lastRoute = id; });
    document.getElementById('pageTitle').textContent = v.title;
    document.getElementById('pageSub').textContent = v.sub || '';
    const root = document.getElementById('viewRoot');
    root.innerHTML = '';
    try { v.render(root); }
    catch (e) {
      console.error(e);
      root.innerHTML = '<div class="card card-pad">页面渲染出错：' + APP.ui.esc(e.message) + '</div>';
    }
    renderNav();
    try { window.scrollTo({ top: 0 }); } catch (e) { }
    // 以 file:// 打开时部分浏览器禁止 history 写入，忽略即可
    try {
      if (window.location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
    } catch (e) {
      try { window.location.hash = id; } catch (e2) { }
    }
  }

  function refresh() {
    document.getElementById('streakNum').textContent = APP.store.streak();
    const s = APP.store.getSettings();
    const chip = document.getElementById('modelChip');
    if (s.apiKey && s.model) {
      chip.textContent = '引擎：' + s.model;
      chip.className = 'model-chip ok';
    } else {
      chip.textContent = '未配置引擎 · 点击设置';
      chip.className = 'model-chip';
    }
    chip.onclick = () => go('settings');
  }

  function printResult() {
    const el = document.getElementById('resultCard') || document.getElementById('resultCard2');
    if (!el) { APP.ui.toast('没有可打印的结果', 'err'); return; }
    const parent = el.parentElement;
    const sibs = Array.from(parent.children);
    sibs.forEach(n => { if (n !== el) n.style.display = 'none'; });
    setTimeout(() => {
      window.print();
      setTimeout(() => sibs.forEach(n => { n.style.display = ''; }), 400);
    }, 60);
  }

  APP.NAV = NAV;
  APP.go = go;
  APP.refresh = refresh;
  APP.printResult = printResult;

  document.addEventListener('DOMContentLoaded', function () {
    const hash = (window.location.hash || '').slice(1);
    const start = APP.views[hash] ? hash : (APP.store.get().lastRoute || 'dashboard');
    refresh();
    go(APP.views[start] ? start : 'dashboard');
    window.addEventListener('hashchange', () => {
      const h = (window.location.hash || '').slice(1);
      if (h && h !== current && APP.views[h]) go(h);
    });
  });
})();

</script>

<!-- ===== 本地文件模式提示 ===== -->
<script>
(function () {
  if (location.protocol.indexOf('file') !== 0) return;
  function tip() {
    if (window.__fileTipShown) return;
    window.__fileTipShown = true;
    var chip = document.getElementById('modelChip');
    if (chip) {
      chip.textContent = '本地文件模式';
      chip.title = '当前是双击打开的本地文件。浏览器默认会拦截它向大模型接口发起的请求（CORS），' +
        '建议：① 用云端链接打开；② 或在设置里改用「复制批改请求」模式';
      chip.className = 'model-chip warn';
    }
  }
  document.addEventListener('DOMContentLoaded', function () { setTimeout(tip, 400); });
  setTimeout(tip, 1200);
})();
</script>
